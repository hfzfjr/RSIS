spring.application.name=rsis

# Load local environment variables from a file in project root (optional).
# Create a `.env` file (see `.env.example`) to make DB config persistent across restarts.
spring.config.import=optional:file:.env[.properties]

# ===== DATABASE (Supabase PostgreSQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false

# ===== APP PORT =====
server.port=8080