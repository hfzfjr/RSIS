<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - RSIS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin/dashboard.css">
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>

<body>

  <div th:replace="~{layout/navbar :: navbar('dashboard')}"></div>
  

  <main>

    <!-- STAT CARDS -->
    <div class="stat-grid">
      <div class="stat-card featured">
        <div class="stat-header">
          <span class="stat-label">Total Pasien Hari Ini</span>
          <div class="stat-icon">👥</div>
        </div>
        <div class="stat-value" th:text="${totalPasienHariIni}">128</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">Total Dokter Aktif</span>
          <div class="stat-icon">👨‍⚕️</div>
        </div>
        <div class="stat-value" th:text="${totalDokter}">24</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">Total Appointment Hari Ini</span>
          <div class="stat-icon">📅</div>
        </div>
        <div class="stat-value" th:text="${totalAppointmentHariIni}">86</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">Appointment Pending</span>
          <div class="stat-icon">📋</div>
        </div>
        <div class="stat-value" th:text="${appointmentPending}">7</div>
      </div>
    </div>

    <!-- CHART -->
    <div class="section-card">
      <div class="section-header">
        <h2 class="section-title">Statistik Kunjungan Pasien</h2>
        <select id="monthSelector" class="month-selector" onchange="fetchMonthlyStats()">
          <option value="1" th:selected="${currentMonth == 1}">Januari</option>
          <option value="2" th:selected="${currentMonth == 2}">Februari</option>
          <option value="3" th:selected="${currentMonth == 3}">Maret</option>
          <option value="4" th:selected="${currentMonth == 4}">April</option>
          <option value="5" th:selected="${currentMonth == 5}">Mei</option>
          <option value="6" th:selected="${currentMonth == 6}">Juni</option>
          <option value="7" th:selected="${currentMonth == 7}">Juli</option>
          <option value="8" th:selected="${currentMonth == 8}">Agustus</option>
          <option value="9" th:selected="${currentMonth == 9}">September</option>
          <option value="10" th:selected="${currentMonth == 10}">Oktober</option>
          <option value="11" th:selected="${currentMonth == 11}">November</option>
          <option value="12" th:selected="${currentMonth == 12}">Desember</option>
        </select>
      </div>

      <div class="chart-area" id="chartArea">
        <!-- Monthly Chart -->
        <div id="patientChart" class="chart-content">
          <th:block th:if="${visitStats != null and !visitStats.isEmpty()}">
            <div th:each="stat : ${visitStats}" class="bar-wrap">
              <div class="bar" th:style="'height:' + ${stat.percentage} + '%'" th:data-tooltip="${stat.count} + ' pasien'"></div>
              <div class="bar-label" th:text="${stat.label}"></div>
            </div>
          </th:block>
          <div th:if="${visitStats == null or visitStats.isEmpty()}" class="chart-empty">
            Tidak ada data statistik kunjungan
          </div>
        </div>
      </div>
    </div>

    <!-- DOCTORS -->
    <div class="section-card">
      <div class="section-header">
        <h2 class="section-title">Dokter Tersibuk</h2>
        <a class="lihat-semua" href="#">Lihat Semua</a>
      </div>

      <div class="doctor-list">
        <th:block th:if="${busiestDoctors != null and !busiestDoctors.isEmpty()}">
          <div th:each="stat, iter : ${busiestDoctors}" class="doctor-item">
            <span class="doctor-rank" th:text="${iter.index < 9 ? '0' + (iter.index + 1) : (iter.index + 1)}">01</span>
            <div class="doctor-avatar">👨‍⚕️</div>
            <div class="doctor-info">
              <div class="doctor-name" th:text="${stat.dokter.nama}">Nama Dokter</div>
              <div class="doctor-spec" th:text="${stat.dokter.spesialisasi != null ? stat.dokter.spesialisasi.nama : '-'}">Spesialisasi</div>
            </div>
            <div class="doctor-stat">
              <div class="doctor-count" th:text="${stat.count} + ' Pasien'">0 Pasien</div>
              <div class="progress-bar">
                <div class="progress-fill" th:style="'width:' + ${stat.percentage} + '%'"></div>
              </div>
            </div>
          </div>
        </th:block>
        <div th:if="${busiestDoctors == null or busiestDoctors.isEmpty()}" class="chart-empty" style="text-align: center; color: #888; padding: 20px;">
          Tidak ada data dokter tersibuk bulan ini
        </div>
      </div>
    </div>

  </main>

  <script>
    function fetchMonthlyStats() {
      const month = document.getElementById('monthSelector').value;
      const chartContainer = document.getElementById('patientChart');
      const doctorListContainer = document.querySelector('.doctor-list');
      
      chartContainer.innerHTML = '<div class="chart-empty">Memuat data...</div>';
      doctorListContainer.innerHTML = '<div class="chart-empty" style="text-align: center; color: #888; padding: 20px;">Memuat data...</div>';

      fetch(`/admin/dashboard/visit-stats?month=${month}`)
        .then(response => response.json())
        .then(data => {
          // 1. Render Chart
          chartContainer.innerHTML = '';
          const visitStats = data.visitStats || [];
          if (visitStats.length === 0) {
            chartContainer.innerHTML = '<div class="chart-empty">Tidak ada data statistik kunjungan</div>';
          } else {
            visitStats.forEach(stat => {
              const barWrap = document.createElement('div');
              barWrap.className = 'bar-wrap';

              const bar = document.createElement('div');
              bar.className = 'bar';
              bar.style.height = `${stat.percentage}%`;
              bar.setAttribute('data-tooltip', `${stat.count} pasien`);

              const barLabel = document.createElement('div');
              barLabel.className = 'bar-label';
              barLabel.textContent = stat.label;

              barWrap.appendChild(bar);
              barWrap.appendChild(barLabel);
              chartContainer.appendChild(barWrap);
            });
          }

          // 2. Render Doctor List
          doctorListContainer.innerHTML = '';
          const busiestDoctors = data.busiestDoctors || [];
          if (busiestDoctors.length === 0) {
            doctorListContainer.innerHTML = '<div class="chart-empty" style="text-align: center; color: #888; padding: 20px;">Tidak ada data dokter tersibuk bulan ini</div>';
          } else {
            busiestDoctors.forEach((stat, index) => {
              const doctorItem = document.createElement('div');
              doctorItem.className = 'doctor-item';

              const rankIndex = index < 9 ? `0${index + 1}` : `${index + 1}`;
              const specName = stat.dokter.spesialisasi ? stat.dokter.spesialisasi.nama : '-';

              doctorItem.innerHTML = `
                <span class="doctor-rank">${rankIndex}</span>
                <div class="doctor-avatar">👨‍⚕️</div>
                <div class="doctor-info">
                  <div class="doctor-name">${stat.dokter.nama}</div>
                  <div class="doctor-spec">${specName}</div>
                </div>
                <div class="doctor-stat">
                  <div class="doctor-count">${stat.count} Pasien</div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${stat.percentage}%"></div>
                  </div>
                </div>
              `;
              doctorListContainer.appendChild(doctorItem);
            });
          }
        })
        .catch(err => {
          console.error('Error fetching stats:', err);
          chartContainer.innerHTML = '<div class="chart-empty">Gagal memuat data statistik</div>';
          doctorListContainer.innerHTML = '<div class="chart-empty" style="text-align: center; color: #888; padding: 20px;">Gagal memuat data dokter tersibuk</div>';
        });
    }
  </script>

</body>

</html>
