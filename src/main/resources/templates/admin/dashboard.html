<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin - RSIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">RSIS</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="/admin/dashboard">Dashboard</a>
          <a class="nav-link" href="/admin/kelola-dokter">Kelola Dokter</a>
          <a class="nav-link" href="/admin/kelola-poli">Kelola Poli</a>
          <a class="nav-link" href="/admin/kelola-spesialisasi"
            >Kelola Spesialisasi</a
          >
          <a class="nav-link" href="/admin/kelola-jadwal">Kelola Jadwal</a>
          <a class="nav-link" href="/admin/laporan">Laporan</a>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <h3>Dashboard Admin</h3>
            </div>
            <div class="card-body">
              <div class="row mt-4">
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Pasien Hari Ini</h5>
                      <p
                        class="card-text display-4"
                        th:text="${totalPasienHariIni}"
                      ></p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Pasien Bulan Ini</h5>
                      <p
                        class="card-text display-4"
                        th:text="${totalPasienBulanIni}"
                      ></p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Total Dokter</h5>
                      <p
                        class="card-text display-4"
                        th:text="${totalDokter}"
                      ></p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Total Poli</h5>
                      <p
                        class="card-text display-4"
                        th:text="${totalPoli}"
                      ></p>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row mt-4">
                <div class="col-md-6">
                  <div class="card">
                    <div class="card-header">
                      <h5>Dokter Tersibuk</h5>
                    </div>
                    <div class="card-body">
                      <p
                        class="card-text"
                        th:text="${dokterTersibuk}"
                      ></p>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="card">
                    <div class="card-header">
                      <h5>Pasien Per Hari</h5>
                    </div>
                    <div class="card-body">
                      <div th:if="${pasienPerHari != null and !pasienPerHari.isEmpty()}">
                        <ul>
                          <li th:each="entry : ${pasienPerHari}">
                            <span th:text="${entry.key}"></span>: <span th:text="${entry.value}"></span>
                          </li>
                        </ul>
                      </div>
                      <div th:if="${pasienPerHari == null or pasienPerHari.isEmpty()}">
                        <p class="card-text">Tidak ada data</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
