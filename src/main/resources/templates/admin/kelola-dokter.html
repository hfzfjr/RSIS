<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Dokter - RSIS</title>
    <link rel="stylesheet" href="/css/admin/kelola-dokter.css" />
    <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
    <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
    <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar('kelola-dokter')}"></div>

    <main class="main-content">
        <div class="content-header">
            <h1 class="page-title">Manajemen Data Dokter</h1>
            <p class="page-subtitle">Kelola jadwal praktik dokter dan data poli rumah sakit</p>
        </div>

        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon stat-icon-blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Jadwal Aktif</span>
                    <span class="stat-value">87</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-orange">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Jadwal Penuh</span>
                    <span class="stat-value">12</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Jadwal Libur</span>
                    <span class="stat-value">5</span>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2 class="table-title">Daftar Dokter</h2>
                <button class="btn btn-primary" onclick="window.location.href='/admin/dokter/create'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Tambah Dokter
                </button>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Foto &amp; Nama</th>
                            <th>Spesialisasi</th>
                            <th>Poli</th>
                            <th>Nomor STR</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dokter, iter : ${dokters}">
                            <td th:text="${iter.index + 1}">1</td>
                            <td>
                                <div class="doctor-info">
                                    <div class="doctor-avatar">
                                        <span th:text="${dokter.nama != null ? dokter.nama.substring(0, 1) : 'D'}">D</span>
                                    </div>
                                    <span class="doctor-name" th:text="${dokter.nama}">Dr. Ahmad Hafiz</span>
                                </div>
                            </td>
                            <td th:text="${dokter.spesialisasi != null ? dokter.spesialisasi.nama : '-'}">Penyakit Dalam</td>
                            <td th:text="${dokter.poli != null ? dokter.poli.namaPoli : '-'}">Poli Penyakit Dalam</td>
                            <td th:text="${dokter.nomorStr != null ? dokter.nomorStr : '-'}">STR-1234567890</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-action btn-edit" th:data-id="${dokter.idUser}" onclick="editDokter(this.dataset.id)" title="Edit">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                    <button class="btn-action btn-delete" th:data-id="${dokter.idUser}" onclick="deleteDokter(this.dataset.id)" title="Hapus">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        </svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${dokters == null or dokters.isEmpty()}">
                            <td colspan="6" class="no-data">Tidak ada data dokter</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function editDokter(id) {
            window.location.href = '/admin/dokter/edit/' + id;
        }

        function deleteDokter(id) {
            if (confirm('Apakah Anda yakin ingin menghapus dokter ini?')) {
                window.location.href = '/admin/dokter/delete/' + id;
            }
        }
    </script>
</body>
</html>
