<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Dokter - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout/navbar.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{layout/navbar-admin :: navbar(activeMenu='kelola-dokter')}"></div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h3>Kelola Dokter</h3>
              <button
                class="btn btn-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#createModal"
              >
                Tambah Dokter
              </button>
            </div>
            <div class="card-body">
              <div
                th:if="${success}"
                class="alert alert-success"
                th:text="${success}"
              ></div>
              <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}"
              ></div>

              <div
                th:if="${dokters == null or dokters.empty}"
                class="alert alert-info"
              >
                Belum ada dokter yang terdaftar.
              </div>

              <div th:if="${dokters != null and !dokters.empty}">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>ID Dokter</th>
                      <th>Nama</th>
                      <th>Nomor STR</th>
                      <th>Spesialisasi</th>
                      <th>Poli</th>
                      <th>Email</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="dokter : ${dokters}">
                      <td th:text="${dokter.idDokter}"></td>
                      <td th:text="${dokter.nama}"></td>
                      <td th:text="${dokter.nomorStr}"></td>
                      <td
                        th:text="${dokter.spesialisasi != null ? dokter.spesialisasi.namaSpesialisasi : 'N/A'}"
                      ></td>
                      <td
                        th:text="${dokter.poli != null ? dokter.poli.namaPoli : 'N/A'}"
                      ></td>
                      <td th:text="${dokter.email}"></td>
                      <td>
                        <button
                          class="btn btn-sm btn-warning"
                          data-bs-toggle="modal"
                          th:data-bs-target="'#editModal-' + ${dokter.idDokter}"
                        >
                          Edit
                        </button>
                        <form
                          th:action="@{/admin/kelola-dokter/delete/{id}(id=${dokter.idDokter})}"
                          method="post"
                          style="display: inline"
                        >
                          <button
                            type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Hapus dokter ini?');"
                          >
                            Hapus
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Dokter</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form
              th:action="@{/admin/kelola-dokter/create}"
              th:object="${dokter}"
              method="post"
            >
              <div class="mb-3">
                <label for="nama" class="form-label">Nama</label>
                <input
                  type="text"
                  class="form-control"
                  id="nama"
                  th:field="*{nama}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="nomorStr" class="form-label">Nomor STR</label>
                <input
                  type="text"
                  class="form-control"
                  id="nomorStr"
                  th:field="*{nomorStr}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  th:field="*{email}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  th:field="*{password}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="nomorHp" class="form-label">Nomor HP</label>
                <input
                  type="tel"
                  class="form-control"
                  id="nomorHp"
                  th:field="*{nomorHp}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
