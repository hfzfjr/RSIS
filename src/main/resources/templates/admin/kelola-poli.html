<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Poli - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout/navbar.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{layout/navbar-admin :: navbar('kelola-poli')}"></div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h3>Kelola Poli</h3>
              <button
                class="btn btn-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#createModal"
              >
                Tambah Poli
              </button>
            </div>
            <div class="card-body">
              <div
                th:if="${success}"
                class="alert alert-success"
                th:text="${success}"
              ></div>
              <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}"
              ></div>

              <div
                th:if="${polis == null or polis.empty}"
                class="alert alert-info"
              >
                Belum ada poli yang terdaftar.
              </div>

              <div th:if="${polis != null and !polis.empty}">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>ID Poli</th>
                      <th>Nama Poli</th>
                      <th>Lokasi</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="poli : ${polis}">
                      <td th:text="${poli.idPoli}"></td>
                      <td th:text="${poli.namaPoli}"></td>
                      <td th:text="${poli.lokasi}"></td>
                      <td>
                        <button
                          class="btn btn-sm btn-warning"
                          data-bs-toggle="modal"
                          th:data-bs-target="'#editModal-' + ${poli.idPoli}"
                        >
                          Edit
                        </button>
                        <form
                          th:action="@{/admin/kelola-poli/delete/{id}(id=${poli.idPoli})}"
                          method="post"
                          style="display: inline"
                        >
                          <button
                            type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Hapus poli ini?');"
                          >
                            Hapus
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Poli</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form
              th:action="@{/admin/kelola-poli/create}"
              th:object="${poli}"
              method="post"
            >
              <div class="mb-3">
                <label for="namaPoli" class="form-label">Nama Poli</label>
                <input
                  type="text"
                  class="form-control"
                  id="namaPoli"
                  th:field="*{namaPoli}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="lokasi" class="form-label">Lokasi</label>
                <input
                  type="text"
                  class="form-control"
                  id="lokasi"
                  th:field="*{lokasi}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
