<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Spesialisasi - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout/navbar.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout/navbar-admin :: navbar(activeMenu='kelola-spesialisasi')}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3>Kelola Spesialisasi</h3>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">Tambah Spesialisasi</button>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <div th:if="${spesialisasis == null or spesialisasis.empty}" class="alert alert-info">
                            Belum ada spesialisasi yang terdaftar.
                        </div>
                        
                        <div th:if="${spesialisasis != null and !spesialisasis.empty}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID Spesialisasi</th>
                                        <th>Nama Spesialisasi</th>
                                        <th>Deskripsi</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="spesialisasi : ${spesialisasis}">
                                        <td th:text="${spesialisasi.idSpesialisasi}"></td>
                                        <td th:text="${spesialisasi.namaSpesialisasi}"></td>
                                        <td th:text="${spesialisasi.deskripsi}"></td>
                                        <td>
                                            <button class="btn btn-sm btn-warning" data-bs-toggle="modal" 
                                                    th:data-bs-target="'#editModal-' + ${spesialisasi.idSpesialisasi}">Edit</button>
                                            <form th:action="@{/admin/kelola-spesialisasi/delete/{id}(id=${spesialisasi.idSpesialisasi})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Hapus spesialisasi ini?')">Hapus</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Spesialisasi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/admin/kelola-spesialisasi/create}" th:object="${spesialisasi}" method="post">
                        <div class="mb-3">
                            <label for="namaSpesialisasi" class="form-label">Nama Spesialisasi</label>
                            <input type="text" class="form-control" id="namaSpesialisasi" th:field="*{namaSpesialisasi}" required>
                        </div>
                        <div class="mb-3">
                            <label for="deskripsi" class="form-label">Deskripsi</label>
                            <textarea class="form-control" id="deskripsi" th:field="*{deskripsi}" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
