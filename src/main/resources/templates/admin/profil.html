<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Admin - RSIS</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/layout/navbar.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/navbar-admin :: navbar(activeMenu='profil')}"></div>

<main>
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h3>Profil Admin</h3>
          </div>
          <div class="card-body">
            <form method="post" th:action="@{/admin/profil/update}">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" th:value="${#authentication.principal.username}" disabled>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Masukkan email" required>
              </div>
              <div class="mb-3">
                <label for="namaPanjang" class="form-label">Nama Panjang</label>
                <input type="text" class="form-control" id="namaPanjang" name="namaPanjang" placeholder="Masukkan nama panjang" required>
              </div>
              <div class="mb-3">
                <label for="noTelepon" class="form-label">Nomor Telepon</label>
                <input type="tel" class="form-control" id="noTelepon" name="noTelepon" placeholder="Masukkan nomor telepon">
              </div>
              <div class="card mt-4">
                <div class="card-header">
                  <h5>Ubah Password</h5>
                </div>
                <div class="card-body">
                  <div class="mb-3">
                    <label for="passwordLama" class="form-label">Password Lama</label>
                    <input type="password" class="form-control" id="passwordLama" name="passwordLama" placeholder="Masukkan password lama">
                  </div>
                  <div class="mb-3">
                    <label for="passwordBaru" class="form-label">Password Baru</label>
                    <input type="password" class="form-control" id="passwordBaru" name="passwordBaru" placeholder="Masukkan password baru">
                  </div>
                  <div class="mb-3">
                    <label for="konfirmasiPassword" class="form-label">Konfirmasi Password</label>
                    <input type="password" class="form-control" id="konfirmasiPassword" name="konfirmasiPassword" placeholder="Konfirmasi password baru">
                  </div>
                </div>
              </div>
              <div class="mt-4">
                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                <a href="/admin/dashboard" class="btn btn-secondary">Batal</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
