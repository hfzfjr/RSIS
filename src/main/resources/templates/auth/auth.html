<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth/auth.css" />
    <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
  </head>
  <body>
    <main class="login-container">
      <section class="login-left">
        <div class="login-left-content">
          <h1 class="login-headline">
            Selamat Datang di Pusat Layanan Kesehatan RSIS
          </h1>
          <p class="login-subtitle">
            Platform booking dokter terpercaya untuk kesehatan Anda dan
            keluarga.
          </p>
        </div>
        <div class="login-left-bg"></div>
      </section>
      
      <section class="login-right">
        <div class="login-form-container">
          <h2 class="login-title">Mulai Sekarang</h2>
          <p class="login-description">
            Silakan masuk atau daftar untuk layanan medis terbaik.
          </p>

          <div class="login-tabs">
            <button class="tab-button active" data-tab="login">Masuk</button>
            <button class="tab-button" data-tab="register">Daftar</button>
          </div>

          <div class="tab-content active" id="login-tab">
            <div th:replace="~{fragments/auth/login-form :: login-form}"></div>
          </div>

          <div class="tab-content" id="register-tab">
            <div th:replace="~{fragments/auth/register-form :: register-form}"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tabButtons = document.querySelectorAll(".tab-button");
        const tabContents = document.querySelectorAll(".tab-content");

        const urlParams = new URLSearchParams(window.location.search);
        const defaultTab = urlParams.get('tab');

        function activateTab(tabName) {
          const targetButton = document.querySelector(`[data-tab="${tabName}"]`);
          const targetContent = document.getElementById(`${tabName}-tab`);
          
          tabButtons.forEach((btn) => btn.classList.remove("active"));
          tabContents.forEach((content) => content.classList.remove("active"));
          
          targetButton.classList.add("active");
          targetContent.classList.add("active");
          
          const newUrl = tabName === 'login' ? '/auth?tab=login' : '/auth?tab=register';
          window.history.replaceState({}, '', newUrl);
        }

        if (defaultTab === 'register') {
          activateTab('register');
        } else if (defaultTab === 'login') {
          activateTab('login');
        }

        tabButtons.forEach((button) => {
          button.addEventListener("click", () => {
            // Logika disembunyikan DISINI, jadi hanya hilang saat tombol diklik!
            const alerts = document.querySelectorAll('.auth-alert');
            alerts.forEach(alert => alert.style.display = 'none');

            const targetTab = button.getAttribute("data-tab");
            activateTab(targetTab);
          });
        });

        const toggleButtons = document.querySelectorAll('.password-toggle');
        
        toggleButtons.forEach(button => {
          button.addEventListener('click', function() {
            const input = this.previousElementSibling; 
            const eyeOpen = this.querySelector('.eye-open');
            const eyeClosed = this.querySelector('.eye-closed');

            if (input && input.tagName === 'INPUT') { 
                if (input.type === 'password') {
                  input.type = 'text';
                  eyeOpen.style.display = 'block';     
                  eyeClosed.style.display = 'none';    
                } else {
                  input.type = 'password';
                  eyeOpen.style.display = 'none';      
                  eyeClosed.style.display = 'block';   
                }
            }
          });
        });
      });
    </script>
  </body>
</html>
