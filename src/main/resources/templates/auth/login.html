<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RSIS</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="icon" type="image/png" href="/images/logo-rsis.png">
</head>
<body>
<main class="auth-shell">
    <div class="auth-bg"></div>

    <section class="auth-card">
        <aside class="auth-left">
            <div class="brand">
                <img class="brand-logo" src="/images/logo-rsis.png" alt="RSIS" />
                <span class="brand-name">RSIS</span>
            </div>

            <h1 class="auth-headline">Selamat Datang</h1>
        </aside>

        <div class="auth-right">
            <div class="auth-form-wrap">
                <h2 class="auth-title">Login</h2>

                <div class="auth-alert auth-alert--error" th:if="${hasError}">
                    Email atau kata sandi salah.
                </div>
                <div
                        class="auth-alert auth-alert--success"
                        th:if="${hasRegistered}"
                >
                    Registrasi berhasil. Silakan login.
                </div>
                <div class="auth-alert auth-alert--info" th:if="${hasLogout}">
                    Kamu sudah logout.
                </div>

                <form class="auth-form" method="post" action="/login">
                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    />

                    <label class="field">
                        <span class="field-label">Alamat Email</span>
                        <input
                                class="field-input"
                                type="email"
                                name="email"
                                autocomplete="email"
                                required
                        />
                    </label>

                    <label class="field">
                        <span class="field-label">Kata Sandi</span>
                        <input
                                class="field-input"
                                type="password"
                                name="password"
                                autocomplete="current-password"
                                required
                        />
                    </label>

                    <a class="auth-link" href="#" aria-disabled="true"
                    >Lupa Kata Sandi?</a
                    >

                    <button class="btn btn-primary" type="submit">Login</button>
                </form>

                <a class="btn btn-secondary" href="/register">
                    Belum Punya Akun? <strong>Daftar</strong>
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
