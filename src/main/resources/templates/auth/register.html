<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
  </head>
  <body>
    <main class="login-container">
      <section class="login-left">
        <div class="login-left-content">
          <h1 class="login-headline">
            Selamat Datang di Pusat Layanan Kesehatan RSIS
          </h1>
          <p class="login-subtitle">
            Platform booking dokter terpercaya untuk kesehatan Anda dan
            keluarga.
          </p>
        </div>
        <div class="login-left-image">
          <img src="/images/doctor-illustration.png" alt="Doctor with tablet" />
        </div>
        <div class="login-left-bg"></div>
      </section>

      <section class="login-right">
        <div class="login-form-container">
          <h2 class="login-title">Mulai Sekarang</h2>
          <p class="login-description">
            Silakan masuk atau daftar untuk layanan medis terbaik.
          </p>

          <div class="login-tabs">
            <a href="/login" class="tab-button">Masuk</a>
            <button class="tab-button active" disabled>Daftar</button>
          </div>

          <!-- Register Form -->
          <form
            class="login-form"
            method="post"
            action="/register"
            id="registerForm"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <div
              class="auth-alert auth-alert--error"
              th:if="${errorMessage}"
              th:text="${errorMessage}"
            >
              Error
            </div>

            <div
              class="auth-alert auth-alert--success"
              th:if="${successMessage}"
              th:text="${successMessage}"
            >
              Success
            </div>

            <div class="field-group">
              <div class="field-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input
                type="text"
                name="namaLengkap"
                id="namaLengkap"
                placeholder="Nama Lengkap"
                th:value="${form.namaLengkap}"
                required
                minlength="3"
                maxlength="100"
              />
            </div>

            <div class="field-group">
              <div class="field-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-10 5L2 7"></path>
                </svg>
              </div>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Email"
                th:value="${form.email}"
                autocomplete="email"
                required
                maxlength="100"
              />
            </div>

            <div class="field-group">
              <div class="field-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="11"
                    rx="2"
                    ry="2"
                  ></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Kata Sandi"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="50"
              />
              <button
                type="button"
                class="password-toggle"
                id="password-toggle"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="eye-open"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  class="eye-closed"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>

            <div class="field-group">
              <div class="field-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="11"
                    rx="2"
                    ry="2"
                  ></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input
                type="password"
                name="confirmPassword"
                id="confirmPassword"
                placeholder="Konfirmasi Kata Sandi"
                autocomplete="new-password"
                required
                minlength="8"
                maxlength="50"
              />
            </div>

            <button class="btn-login" type="submit" id="registerBtn">
              Daftar
            </button>

            <div class="login-link">
              Sudah punya akun? <a href="/login">Masuk di sini</a>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Password visibility toggle
        const passwordToggle = document.getElementById("password-toggle");
        const passwordInput = document.getElementById("password");
        const eyeOpen = passwordToggle.querySelector(".eye-open");
        const eyeClosed = passwordToggle.querySelector(".eye-closed");

        if (passwordToggle && passwordInput) {
          passwordToggle.addEventListener("click", () => {
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              eyeOpen.style.display = "none";
              eyeClosed.style.display = "block";
            } else {
              passwordInput.type = "password";
              eyeOpen.style.display = "block";
              eyeClosed.style.display = "none";
            }
          });
        }

        // Form validation
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const password = document.getElementById("password");

        if (confirmPasswordInput && password) {
          confirmPasswordInput.addEventListener("input", function () {
            if (this.value && this.value !== password.value) {
              this.style.borderColor = "#ef4444";
            } else if (this.value && this.value === password.value) {
              this.style.borderColor = "#10b981";
            } else {
              this.style.borderColor = "";
            }
          });
        }
      });
    </script>

    <style>
      .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .login-link a {
        color: var(--green-primary);
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.3s ease;
      }

      .login-link a:hover {
        opacity: 0.8;
      }

      /* Additional responsive adjustments for register page */
      @media (max-width: 480px) {
        .login-link {
          font-size: 0.85rem;
          margin-top: 16px;
        }
      }
    </style>
  </body>
</html>
