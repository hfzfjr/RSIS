<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RSIS</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-shell">
    <div class="auth-bg"></div>

    <section class="auth-card">
        <aside class="auth-left">
            <div class="brand">
                <img class="brand-logo" src="/images/logo-rsis.png" alt="RSIS">
                <span class="brand-name">RSIS</span>
            </div>

            <h1 class="auth-headline">Nikmati Kemudahan<br>Berobat Yang Tidak<br>Ada Di Rumah Sakit<br>Manapun!</h1>
        </aside>

        <div class="auth-right">
            <div class="auth-form-wrap">
                <h2 class="auth-title">Daftar Akun</h2>

                <div class="auth-alert auth-alert--error" th:if="${errorMessage}" th:text="${errorMessage}">
                    Error
                </div>

                <form class="auth-form" method="post" action="/register">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <label class="field">
                        <span class="field-label">Nama Lengkap</span>
                        <input class="field-input" type="text" name="nama" th:value="${form.nama}" autocomplete="name" required>
                    </label>

                    <label class="field">
                        <span class="field-label">Alamat Email</span>
                        <input class="field-input" type="email" name="email" th:value="${form.email}" autocomplete="email" required>
                    </label>

                    <label class="field">
                        <span class="field-label">Kata Sandi</span>
                        <input class="field-input" type="password" name="password" autocomplete="new-password" required>
                    </label>

                    <button class="btn btn-primary" type="submit">Daftar</button>
                </form>

                <a class="btn btn-secondary" href="/login">
                    Sudah Punya Akun? <strong>Login</strong>
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
