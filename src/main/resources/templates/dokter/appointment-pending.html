<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Pending - RSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RSIS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dokter/dashboard">Dashboard</a>
                <a class="nav-link" href="/dokter/jadwal">Jadwal Praktik</a>
                <a class="nav-link" href="/dokter/daftar-pasien">Daftar Pasien</a>
                <a class="nav-link active" href="/dokter/appointment/pending">Appointment Pending</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3>Appointment Pending</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <div th:if="${appointments == null or appointments.empty}" class="alert alert-info">
                            Tidak ada appointment yang pending.
                        </div>
                        
                        <div th:if="${appointments != null and !appointments.empty}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID Appointment</th>
                                        <th>Nama Pasien</th>
                                        <th>Tanggal Booking</th>
                                        <th>Jadwal</th>
                                        <th>Catatan</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="appointment : ${appointments}">
                                        <td th:text="${appointment.idAppointment}"></td>
                                        <td th:text="${appointment.pasien != null ? appointment.pasien.nama : 'N/A'}"></td>
                                        <td th:text="${appointment.tanggalBooking}"></td>
                                        <td th:text="${appointment.jadwal != null ? appointment.jadwal.hari + ' ' + appointment.jadwal.jamMulai : 'N/A'}"></td>
                                        <td th:text="${appointment.catatan}"></td>
                                        <td>
                                            <form th:action="@{/dokter/appointment/konfirmasi/{id}(id=${appointment.idAppointment})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-success">Konfirmasi</button>
                                            </form>
                                            <button class="btn btn-sm btn-warning" data-bs-toggle="modal" 
                                                    th:data-bs-target="'#tolakModal-' + ${appointment.idAppointment}">Tolak</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tolak Modals -->
    <div th:each="appointment : ${appointments}" th:if="${appointments != null and !appointments.empty}">
        <div class="modal fade" th:id="'tolakModal-' + ${appointment.idAppointment}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Tolak Appointment</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/dokter/appointment/tolak/{id}(id=${appointment.idAppointment})}" method="post">
                            <div class="mb-3">
                                <label for="alasan" class="form-label">Alasan Penolakan</label>
                                <textarea class="form-control" id="alasan" name="alasan" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger">Tolak</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
