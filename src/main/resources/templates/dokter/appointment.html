<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointment Dokter - RSIS</title>
  <link rel="stylesheet" href="/css/style.css" />

  <link rel="stylesheet" href="/css/dokter/appointment.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
  <link rel="stylesheet" href="/css/fragments/overlay/dokter/detail-appointment.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/dokter/tolak-appointment.css" />
</head>
<body>
  <div th:replace="layout/navbar :: navbar('appointment')"></div>
  <div th:replace="fragments/overlay/notifikasi :: notifikasi-overlay"></div>

  <main class="appointment-main">
    <div class="appointment-header">
      <h1 class="appointment-title">Daftar Appointment</h1>

    </div>

    <div class="appointment-filter">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Cari nama pasien..." class="form-control" />
      </div>
      <div class="filter-options">
        <select class="form-select" id="statusFilter">
          <option value="">Semua Status</option>
          <option value="MENUNGGU">Menunggu</option>
          <option value="DIKONFIRMASI">Dikonfirmasi</option>
        </select>
        <select class="form-select" id="dateFilter">
          <option value="">Semua Tanggal</option>
          <option value="today">Hari Ini</option>
          <option value="this_week">Minggu Ini</option>
          <option value="this_month">Bulan Ini</option>
        </select>
      </div>
    </div>

    <div class="appointment-table-container">
      <table class="appointment-table">
        <thead>
          <tr>
            <th>PASIEN</th>
            <th>TANGGAL & WAKTU</th>
            <th>KELUHAN</th>
            <th>STATUS</th>
            <th>AKSI</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(appointments)}">
            <td colspan="5" class="text-center">Tidak ada data appointment.</td>
          </tr>
          
          <tr th:each="appt : ${appointments}" 
              th:data-status="${appt.status}" 
              th:data-date="${appt.tanggalBooking}"
              th:data-name="${appt.user.nama}">
            <td class="hidden-id" th:text="${appt.idAppointment}"></td>
            
            <td>
              <div class="patient-info">
                <div class="patient-avatar">
                  <img src="/images/user-avatar.svg" alt="Avatar" />
                </div>
                <div class="patient-details">
                  <div class="patient-name" th:text="${appt.user.nama}">Nama Pasien</div>
                  <div class="patient-id" th:text="${'ID: ' + appt.user.idUser}">ID</div>
                </div>
              </div>
            </td>
            
            <td>
              <div class="date-time">
                <span class="date" th:text="${appt.tanggalBooking}">2025-10-05</span>
                <span class="time" th:text="${#strings.substring(appt.jadwal.jamMulai, 0, 5) + ' WIB'}">09:30 WIB</span>
              </div>
            </td>
            
            <td class="keluhan" th:text="${appt.catatan != null ? appt.catatan : 'Konsultasi Umum'}">Keluhan</td>
            
            <td>
              <span th:if="${appt.status == 'MENUNGGU'}" class="status-badge status-purple"><span class="status-dot"></span>Menunggu</span>
              <span th:if="${appt.status == 'DIKONFIRMASI'}" class="status-badge status-green"><span class="status-dot"></span>Dikonfirmasi</span>
              <span th:if="${appt.status == 'DITOLAK'}" class="status-badge status-red"><span class="status-dot"></span>Ditolak</span>
              <span th:if="${appt.status == 'BATAL'}" class="status-badge status-red"><span class="status-dot"></span>Batal</span>
              <span th:if="${appt.status == 'SELESAI'}" class="status-badge status-green"><span class="status-dot"></span>Selesai</span>
            </td>
            
            <td>
              <button class="btn-selengkapnya"
                      th:data-target="'detailModal-' + ${appt.idAppointment}" 
                      onclick="openModal(this.getAttribute('data-target'))">
                Selengkapnya
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
    
  <div th:each="appt : ${appointments}">
    
    <div th:replace="~{fragments/overlay/dokter/detail-appointment :: modal-detail(appt=${appt})}"></div>
    
    <div th:replace="~{fragments/overlay/dokter/tolak-appointment :: modal-tolak(appt=${appt})}"></div>

  </div>
  <script>
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';
      }
    }
    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }

    // Filter functionality
    document.addEventListener('DOMContentLoaded', function() {
      const statusFilter = document.getElementById('statusFilter');
      const dateFilter = document.getElementById('dateFilter');
      const searchInput = document.getElementById('searchInput');
      const tableRows = document.querySelectorAll('tbody tr[data-status]');

      function filterAppointments() {
        const selectedStatus = statusFilter.value;
        const selectedDate = dateFilter.value;
        const searchValue = searchInput.value.toLowerCase();
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        tableRows.forEach(row => {
          const rowStatus = row.getAttribute('data-status');
          const rowDate = new Date(row.getAttribute('data-date'));
          const rowName = row.getAttribute('data-name')?.toLowerCase() || '';
          rowDate.setHours(0, 0, 0, 0);

          // When 'Semua Status' is selected, only show MENUNGGU and DIKONFIRMASI
          let statusMatch;
          if (selectedStatus === '') {
            statusMatch = rowStatus === 'MENUNGGU' || rowStatus === 'DIKONFIRMASI';
          } else {
            statusMatch = rowStatus === selectedStatus;
          }
          
          let dateMatch = true;

          if (selectedDate === 'today') {
            dateMatch = rowDate.getTime() === today.getTime();
          } else if (selectedDate === 'this_week') {
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay());
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            dateMatch = rowDate >= weekStart && rowDate <= weekEnd;
          } else if (selectedDate === 'this_month') {
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
            const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            dateMatch = rowDate >= monthStart && rowDate <= monthEnd;
          }

          const searchMatch = rowName.includes(searchValue);

          if (statusMatch && dateMatch && searchMatch) {
            row.style.display = '';
          } else {
            row.style.display = 'none';
          }
        });
      }

      statusFilter.addEventListener('change', filterAppointments);
      dateFilter.addEventListener('change', filterAppointments);
      searchInput.addEventListener('input', filterAppointments);

      // Initial filter to show only MENUNGGU and DIKONFIRMASI
      tableRows.forEach(row => {
        const rowStatus = row.getAttribute('data-status');
        if (rowStatus !== 'MENUNGGU' && rowStatus !== 'DIKONFIRMASI') {
          row.style.display = 'none';
        }
      });

      // Set initial status filter value
      statusFilter.value = '';
    });
  </script>
</body>
</html>
