<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Pasien - RSIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">RSIS</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/dokter/dashboard">Dashboard</a>
          <a class="nav-link" href="/dokter/jadwal">Jadwal Praktik</a>
          <a class="nav-link active" href="/dokter/daftar-pasien"
            >Daftar Pasien</a
          >
          <a class="nav-link" href="/dokter/appointment/pending"
            >Appointment Pending</a
          >
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <h3>Daftar Pasien</h3>
            </div>
            <div class="card-body">
              <div
                th:if="${appointments == null or appointments.empty}"
                class="alert alert-info"
              >
                Belum ada pasien yang terdaftar.
              </div>

              <div th:if="${appointments != null and !appointments.empty}">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>ID Appointment</th>
                      <th>Nama Pasien</th>
                      <th>Tanggal Booking</th>
                      <th>Status</th>
                      <th>Nomor Antrian</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="appointment : ${appointments}">
                      <td th:text="${appointment.idAppointment}"></td>
                      <td
                        th:text="${appointment.pasien != null ? appointment.pasien.nama : 'N/A'}"
                      ></td>
                      <td th:text="${appointment.tanggalBooking}"></td>
                      <td>
                        <span
                          class="badge"
                          th:class="'badge bg-' + (${appointment.status} == 'DIKONFIRMASI' ? 'success' : ${appointment.status} == 'MENUNGGU' ? 'warning' : 'danger')"
                          th:text="${appointment.status}"
                        ></span>
                      </td>
                      <td th:text="${appointment.nomorAntrian}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
