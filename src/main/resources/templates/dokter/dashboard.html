<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Dokter - RSIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dokter/dashboard.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
  <meta name="_csrf" th:content="${_csrf.token}" />
</head>
<body>
  <div th:replace="layout/navbar :: navbar('dashboard')"></div>
  <div th:replace="fragments/overlay/notifikasi :: notifikasi-overlay"></div>

  <main class="rs-main-content">
    <div class="rs-stats-grid">
      <div class="rs-stat-card"><div class="rs-stat-icon-wrapper rs-icon-blue"><i class="bi bi-calendar3"></i></div><div class="rs-stat-data"><span class="rs-stat-title">Total Appointment</span><span class="rs-stat-value" id="count-today-appointments">0</span></div></div>
      <div class="rs-stat-card"><div class="rs-stat-icon-wrapper rs-icon-red"><i class="bi bi-clipboard-pulse"></i></div><div class="rs-stat-data"><span class="rs-stat-title">Menunggu Konfirmasi</span><span class="rs-stat-value" id="count-pending">0</span></div></div>
      <div class="rs-stat-card"><div class="rs-stat-icon-wrapper rs-icon-green"><i class="bi bi-people"></i></div><div class="rs-stat-data"><span class="rs-stat-title">Pasien Dikonfirmasi</span><span class="rs-stat-value" id="count-total-pasien">0</span></div></div>
      <div class="rs-stat-card"><div class="rs-stat-icon-wrapper rs-icon-purple"><i class="bi bi-clock"></i></div><div class="rs-stat-data"><span class="rs-stat-title">Sesi Praktik</span><span class="rs-stat-value" id="count-active-sessions">0</span></div></div>
    </div>

    <div class="rs-layout-grid">
      <div class="rs-column-left">
        <div>
          <h2 class="rs-section-title">Antrian Pasien Dikonfirmasi</h2>
          <div class="rs-panel">
            <div class="rs-list" id="queue-list">
              <p style="text-align: center; padding: 20px; color: #666;">Belum ada antrian pasien.</p>
            </div>
            <div class="rs-panel-footer">
              <span class="rs-footer-text" id="queue-footer-text"></span>
              <a href="/dokter/appointment" class="rs-footer-link">Lihat Semua</a>
            </div>
          </div>
        </div>

        <div>
          <h2 class="rs-section-title">Appointment Menunggu Konfirmasi</h2>
          <div class="rs-panel">
            <div class="rs-list" id="pending-list">
               <p style="text-align: center; padding: 20px; color: #666;">Tidak ada permintaan baru.</p>
            </div>
            <div class="rs-panel-footer">
              <span class="rs-footer-text" id="pending-footer-text"></span>
              <a href="/dokter/appointment" class="rs-footer-link">Lihat Semua</a>
            </div>
          </div>
        </div>
      </div>

      <div class="rs-column-right">
        <div>
          <h2 class="rs-section-title">Jadwal Praktik Anda</h2>
          <div class="rs-schedule-panel">
            <div class="rs-timeline" id="timeline-container">
               </div>
            <a href="/dokter/jadwal-praktik" class="rs-btn rs-btn-wide" style="text-decoration: none;">
              <i class="bi bi-calendar-check"></i> Kelola Jadwal
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      
      // FETCH APPOINTMENTS & QUEUE
      fetch('/dokter/appointment')
        .then(response => response.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const rows = doc.querySelectorAll('tbody tr');

          let pendingHTML = ''; let queueHTML = '';
          let pendingCount = 0; let confirmedCount = 0; let totalCount = 0;
          let queueNum = 1;

          rows.forEach((row) => {
            const cols = row.querySelectorAll('td');
            if (cols.length < 8) return; 
            
            const id = cols[0].textContent.trim();
            const patientName = cols[2].querySelector('.patient-name') ? cols[2].querySelector('.patient-name').textContent.trim() : 'Anonim';
            const bookingDate = cols[3].textContent.trim();
            const time = cols[4].textContent.trim();
            const status = cols[6].textContent.trim();
            totalCount++;

            if (status === 'MENUNGGU') {
              pendingCount++;
              if (pendingCount <= 3) {
                pendingHTML += `
                  <div class="rs-appoint-item">
                    <div class="rs-appoint-left">
                      <div class="rs-user-icon-circle"><i class="bi bi-person"></i></div>
                      <div class="rs-appoint-details">
                        <div class="rs-appoint-name">${patientName}</div>
                        <div class="rs-badge-row">
                          <span class="rs-date-badge"><i class="bi bi-calendar"></i> ${bookingDate}, ${time}</span>
                        </div>
                      </div>
                    </div>
                    <div class="rs-appoint-actions">
                      <button class="rs-btn rs-btn-outline" style="padding: 5px 10px; font-size:12px;" onclick="rejectAppointment('${id}')">Tolak</button>
                      <button class="rs-btn rs-btn-primary" style="padding: 5px 10px; font-size:12px;" onclick="confirmAppointment('${id}')">Terima</button>
                    </div>
                  </div>`;
              }
            } else if (status === 'DIKONFIRMASI') {
              confirmedCount++;
              if (confirmedCount <= 3) {
                const statusClass = queueNum === 1 ? 'active' : 'waiting';
                const statusText = queueNum === 1 ? 'Antrian Saat Ini' : 'Menunggu';
                queueHTML += `
                  <div class="rs-queue-item">
                    <div class="rs-queue-left">
                      <div class="rs-number-badge">0${queueNum}</div>
                      <div class="rs-patient-info">
                        <div class="rs-patient-name">${patientName}</div>
                        <div class="rs-patient-meta">Jadwal: ${bookingDate}, ${time}</div>
                      </div>
                    </div>
                    <div class="rs-status-tag ${statusClass}">${statusText}</div>
                  </div>`;
                queueNum++;
              }
            }
          });

          document.getElementById('count-pending').textContent = pendingCount;
          document.getElementById('count-total-pasien').textContent = confirmedCount;
          document.getElementById('count-today-appointments').textContent = totalCount;

          if (pendingCount > 0) document.getElementById('pending-list').innerHTML = pendingHTML;
          if (confirmedCount > 0) document.getElementById('queue-list').innerHTML = queueHTML;
        }).catch(err => console.warn(err));

      // FETCH TIMELINE JADWAL
      fetch('/dokter/jadwal-praktik')
        .then(response => response.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const rows = doc.querySelectorAll('.rs-table tbody tr');
          let timelineHTML = '';
          let countSesi = 0;

          rows.forEach((row, index) => {
            const cols = row.querySelectorAll('td');
            if (cols.length < 5 || cols[0].colSpan > 1) return;
            countSesi++;
            const day = cols[0].textContent.trim();
            const time = cols[1].textContent.trim();
            const isActive = index === 0 ? 'active' : '';

            timelineHTML += `
              <div class="rs-timeline-item">
                <div class="rs-timeline-dot ${isActive}"></div>
                <div class="rs-timeline-content">
                  <div class="rs-timeline-title">Hari ${day}</div>
                  <div class="rs-timeline-time">${time}</div>
                </div>
              </div>`;
          });

          document.getElementById('count-active-sessions').textContent = countSesi;
          if (countSesi > 0) document.getElementById('timeline-container').innerHTML = timelineHTML;
        }).catch(err => console.warn(err));
    });

    function confirmAppointment(id) {
      if (confirm('Konfirmasi pasien ini?')) {
        const form = document.createElement('form'); form.method = 'POST'; form.action = `/dokter/appointment/konfirmasi/${id}`;
        const csrf = document.createElement('input'); csrf.type = 'hidden'; csrf.name = '_csrf'; csrf.value = document.querySelector('meta[name="_csrf"]').content;
        form.appendChild(csrf); document.body.appendChild(form); form.submit();
      }
    }

    function rejectAppointment(id) {
      const reason = prompt('Alasan penolakan:');
      if (reason) {
        const form = document.createElement('form'); form.method = 'POST'; form.action = `/dokter/appointment/tolak/${id}`;
        const csrf = document.createElement('input'); csrf.type = 'hidden'; csrf.name = '_csrf'; csrf.value = document.querySelector('meta[name="_csrf"]').content;
        const resInput = document.createElement('input'); resInput.type = 'hidden'; resInput.name = 'alasan'; resInput.value = reason;
        form.append(csrf, resInput); document.body.appendChild(form); form.submit();
      }
    }
  </script>
</body>
</html>
