<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Dokter - RSIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">RSIS</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="/dokter/dashboard">Dashboard</a>
          <a class="nav-link" href="/dokter/jadwal">Jadwal Praktik</a>
          <a class="nav-link" href="/dokter/daftar-pasien">Daftar Pasien</a>
          <a class="nav-link" href="/dokter/appointment/pending"
            >Appointment Pending</a
          >
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">
              <h3>Selamat Datang, Dokter</h3>
            </div>
            <div class="card-body">
              <p>ID Dokter: <span th:text="${dokterId}"></span></p>
              <div class="row mt-4">
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Appointment Hari Ini</h5>
                      <p class="card-text display-4">0</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Pasien Total</h5>
                      <p class="card-text display-4">0</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Jadwal Aktif</h5>
                      <p class="card-text display-4">0</p>
                    </div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="card text-center">
                    <div class="card-body">
                      <h5 class="card-title">Pending</h5>
                      <p class="card-text display-4">0</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
