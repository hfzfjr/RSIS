<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Praktik - RSIS</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dokter/jadwal-praktik.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  <link rel="stylesheet" href="/css/fragments/jadwal-dokter.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/dokter/tambah-jadwal.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/dokter/edit-jadwal.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/dokter/hapus-jadwal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>

<body>
  <div th:replace="layout/navbar :: navbar('jadwal-praktik')"></div>

  <main class="rs-main-container">
    <div class="rs-page-header">
      <div class="rs-header-left">
        <h1 class="rs-title">Jadwal Praktik</h1>
        <span class="rs-subtitle">Kelola jadwal dan ketersediaan praktik Anda</span>
      </div>
      <button class="rs-btn rs-btn-primary" id="btnTambahJadwal" th:data-dokter-id="${!jadwals.empty ? jadwals[0].dokter.idUser : ''}">
        <i class="bi bi-plus-lg"></i> Tambah Jadwal
      </button>
    </div>

    <div th:if="${success}" class="alert alert-success">
      <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
      <span th:text="${error}"></span>
    </div>
    <!-- Weekly Schedule Section -->
    <div
      th:replace="~{fragments/jadwal-dokter :: jadwal-dokter(${!jadwals.empty ? jadwals[0].dokter.idUser : ''}, 'dokter')}">
    </div>

    <h2 class="rs-section-title">Semua Jadwal Praktik</h2>
    <div class="rs-table-panel">
      <table class="rs-table">
        <thead>
          <tr>
            <th>Hari</th>
            <th>Jam</th>
            <th>Poli</th>
            <th>Kuota</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${jadwals.empty}">
            <td colspan="6" class="empty-row">Belum ada jadwal praktik.</td>
          </tr>
          <tr th:each="jadwal : ${jadwals}">
            <td th:text="${#strings.capitalize(#strings.toLowerCase(jadwal.hari))}">Hari</td>
            <td
              th:text="${#strings.substring(jadwal.jamMulai, 0, 5) + ' - ' + #strings.substring(jadwal.jamSelesai, 0, 5)}">
              Jam</td>
            <td
              th:text="${jadwal.dokter != null && jadwal.dokter.poli != null ? jadwal.dokter.poli.namaPoli : 'Poli Umum'}">
              Poli</td>
            <td th:text="${jadwal.kuota + ' Pasien'}">Kuota</td>
            <td>
              <span
                th:class="'rs-status-badge ' + ${#strings.toLowerCase(jadwal.statusKetersediaan == 'TERSEDIA' ? 'aktif' : (jadwal.statusKetersediaan == 'PENUH' ? 'penuh' : 'libur'))}"
                th:text="${jadwal.statusKetersediaan == 'TERSEDIA' ? 'Aktif' : (jadwal.statusKetersediaan == 'PENUH' ? 'Penuh' : 'Libur')}">Aktif</span>
            </td>
            <td>
              <div class="rs-action-group">
                <button class="rs-action-btn edit"
                  th:data-id="${jadwal.idJadwal}"
                  th:data-hari="${jadwal.hari}"
                  th:data-tanggal="${jadwal.tanggal}"
                  th:data-jam-mulai="${jadwal.jamMulai}"
                  th:data-jam-selesai="${jadwal.jamSelesai}"
                  th:data-status-ketersediaan="${jadwal.statusKetersediaan}"
                  th:data-kuota="${jadwal.kuota}"
                  onclick="openEditJadwalOverlay(this)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="rs-action-btn delete"
                  th:data-id="${jadwal.idJadwal}"
                  onclick="openHapusJadwalOverlay(this)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const rawJadwals = /*[[${jadwals}]]*/[];
    window.jadwalData = []; // Will be populated from API

    // Override fetchJadwalData to call dokter API
    window.fetchJadwalData = async function () {
      try {
        const response = await fetch('/jadwal/api');
        const data = await response.json();
        if (data.success) {
          window.jadwalData = data.jadwals;
          console.log('Dokter jadwal data fetched:', window.jadwalData);
        } else {
          console.error('API returned error:', data.message);
          window.jadwalData = [];
        }
      } catch (error) {
        console.error('Error fetching dokter jadwal data:', error);
        window.jadwalData = [];
      }
      window.renderWeeklyGrid();
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize global variables
      window.currentMonthOffset = 0;

      // Helper function to convert text values and override header
      function setupHeader() {
        const titleEl = document.getElementById('monthToggleTitle');
        if (titleEl) {
          titleEl.textContent = window.currentMonthOffset === 0 ? 'Bulan Ini' : 'Bulan Depan';
        }
        const buttonsWrapper = document.querySelector('.month-toggle-buttons');
        if (buttonsWrapper) {
          buttonsWrapper.innerHTML = `
              <button class="toggle-btn${window.currentMonthOffset === 0 ? ' active' : ''}" id="btnBulanIni" onclick="switchMonthMode(0)">Bulan Ini</button>
              <button class="toggle-btn${window.currentMonthOffset === 1 ? ' active' : ''}" id="btnBulanDepan" onclick="switchMonthMode(1)">Bulan Depan</button>
          `;
        }
      }
      setupHeader();

      // Define function to switch month
      window.switchMonthMode = function (offset) {
        window.currentMonthOffset = offset;
        setupHeader();
        window.renderWeeklyGrid();
      };

      // Define helper for getting target month days
      window.getMonthDays = function (monthOffset) {
        const today = new Date();
        const targetMonth = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
        const year = targetMonth.getFullYear();
        const month = targetMonth.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        let startDate;
        let numberOfDays;
        if (monthOffset === 0) {
          startDate = new Date(today);
          const lastDayOfMonth = new Date(year, month + 1, 0);
          numberOfDays = Math.ceil((lastDayOfMonth - startDate) / (1000 * 60 * 60 * 24)) + 1;
        } else {
          startDate = new Date(year, month, 1);
          numberOfDays = daysInMonth;
        }

        const days = [];
        for (let i = 0; i < numberOfDays; i++) {
          const d = new Date(startDate);
          d.setDate(startDate.getDate() + i);
          days.push(d);
        }
        return days;
      };

      // Override standard switchMonth function
      window.switchMonth = function (mode) {
        if (mode === 'ini') window.switchMonthMode(0);
        else if (mode === 'depan') window.switchMonthMode(1);
      };

      // Helper function to format time (HH:mm)
      function formatTime(timeStr) {
        if (!timeStr) return '';
        if (typeof timeStr === 'string') {
          const parts = timeStr.split(':');
          return parts.slice(0, 2).join(':');
        }
        if (Array.isArray(timeStr)) {
          const h = String(timeStr[0]).padStart(2, '0');
          const m = String(timeStr[1]).padStart(2, '0');
          return `${h}:${m}`;
        }
        return timeStr;
      }

      // Helper to format date string (YYYY-MM-DD) to match Date object
      function isSameDate(dateStr, dateObj) {
        if (!dateStr) return false;
        const parts = dateStr.split('-');
        return parseInt(parts[0]) === dateObj.getFullYear()
          && parseInt(parts[1]) === (dateObj.getMonth() + 1)
          && parseInt(parts[2]) === dateObj.getDate();
      }

      // Override renderWeeklyGrid globally to show monthly layout with actual appointment dates
      window.renderWeeklyGrid = function () {
        const grid = document.getElementById('weeklyGrid');
        if (!grid) return;
        grid.innerHTML = '';

        // Ensure grid styling permits horizontal scrolling for monthly layout
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'none';
        grid.style.gridAutoFlow = 'column';
        grid.style.minWidth = 'fit-content';

        const days = window.getMonthDays(window.currentMonthOffset);
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const dayNamesIndo = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

        days.forEach((date, index) => {
          const col = document.createElement('div');
          col.className = 'day-column';

          const isToday = date.toDateString() === today.toDateString();
          const isSunday = date.getDay() === 0;

          if (isToday) {
            col.classList.add('active');
          }

          const header = document.createElement('div');
          header.className = 'day-header' + (isToday ? ' today' : '');

          const dayNameEl = document.createElement('span');
          dayNameEl.className = 'day-name' + (isSunday ? ' sunday' : '');
          dayNameEl.textContent = dayNamesIndo[date.getDay()];

          const dayDateEl = document.createElement('span');
          dayDateEl.className = 'day-date' + (isSunday ? ' sunday' : '');
          dayDateEl.textContent = `${date.getDate()} ${monthShort[date.getMonth()]}`;

          header.appendChild(dayNameEl);
          header.appendChild(dayDateEl);
          col.appendChild(header);

          // Filter jadwal entries by actual tanggal (appointment date)
          const dayJadwals = (window.jadwalData || []).filter(j => isSameDate(j.tanggal, date));

          const cardsWrapper = document.createElement('div');
          cardsWrapper.className = 'day-cards';

          if (dayJadwals.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'no-schedule-text';
            empty.textContent = 'Tidak ada appointment';
            empty.style.margin = 'auto';
            empty.style.color = '#94a3b8';
            empty.style.fontSize = '12px';
            cardsWrapper.appendChild(empty);
          } else {
            dayJadwals.forEach(jadwal => {
              const isPast = date < today;
              const isFull = jadwal.sisaKuota === 0 || jadwal.statusKetersediaan === 'PENUH';
              const isLibur = jadwal.statusKetersediaan === 'LIBUR';
              const aptStatus = jadwal.appointmentStatus || '';

              const card = document.createElement('div');
              card.className = 'schedule-card';

              if (isPast || aptStatus === 'DIBATALKAN' || aptStatus === 'DITOLAK') {
                card.classList.add('card-past');
              } else if (aptStatus === 'DIKONFIRMASI') {
                card.classList.add('card-available');
              } else if (aptStatus === 'MENUNGGU') {
                card.classList.add('card-full');
              } else if (isLibur) {
                card.classList.add('card-past');
              } else if (isFull) {
                card.classList.add('card-full');
              } else {
                card.classList.add('card-available');
              }

              const timeEl = document.createElement('div');
              timeEl.className = 'card-time';
              timeEl.textContent = `${formatTime(jadwal.jamMulai)} - ${formatTime(jadwal.jamSelesai)}`;
              card.appendChild(timeEl);

              const poliEl = document.createElement('div');
              poliEl.className = 'card-poli';
              poliEl.textContent = jadwal.dokter?.poli?.namaPoli || 'Poli Umum';
              card.appendChild(poliEl);

              // Show patient name
              if (jadwal.namaPasien) {
                const pasienEl = document.createElement('div');
                pasienEl.className = 'card-pasien-name';
                pasienEl.textContent = jadwal.namaPasien;
                card.appendChild(pasienEl);
              }

              const footerEl = document.createElement('div');
              footerEl.className = 'card-footer';

              const statusBadge = document.createElement('span');
              statusBadge.className = 'card-badge';

              // Show appointment status instead of jadwal status
              if (aptStatus === 'DIKONFIRMASI') {
                statusBadge.classList.add('badge-aktif');
                statusBadge.textContent = 'Dikonfirmasi';
              } else if (aptStatus === 'MENUNGGU') {
                statusBadge.classList.add('badge-full');
                statusBadge.textContent = 'Menunggu';
              } else if (aptStatus === 'DIBATALKAN') {
                statusBadge.classList.add('badge-libur');
                statusBadge.textContent = 'Dibatalkan';
              } else if (aptStatus === 'DITOLAK') {
                statusBadge.classList.add('badge-libur');
                statusBadge.textContent = 'Ditolak';
              } else {
                statusBadge.classList.add('badge-aktif');
                statusBadge.textContent = 'Aktif';
              }

              const queueEl = document.createElement('span');
              queueEl.className = 'card-quota';
              queueEl.textContent = jadwal.nomorAntrian || '';

              footerEl.appendChild(statusBadge);
              footerEl.appendChild(queueEl);

              card.appendChild(footerEl);
              cardsWrapper.appendChild(card);
            });
          }

          col.appendChild(cardsWrapper);
          grid.appendChild(col);
        });
      };

      // Periodic check to ensure header is set correctly
      setInterval(setupHeader, 1000);

      // Fetch data from API and trigger initial render
      window.fetchJadwalData();

      // Handle tambah jadwal button click
      document.getElementById('btnTambahJadwal').addEventListener('click', function() {
        const dokterId = this.getAttribute('data-dokter-id');
        if (dokterId) {
          openTambahJadwalOverlay(dokterId);
        }
      });
    });
    /*]]>*/
  </script>

  <!-- Overlay Fragments -->
  <div th:replace="~{fragments/overlay/dokter/tambah-jadwal :: overlay}"></div>
  <div th:replace="~{fragments/overlay/dokter/edit-jadwal :: overlay}"></div>
  <div th:replace="~{fragments/overlay/dokter/hapus-jadwal :: overlay}"></div>
</body>

</html>
