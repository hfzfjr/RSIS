<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Praktik - RSIS</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    .modal { display: none; position: fixed; top: 0; left: 0; z-index: 1055; width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; background-color: rgba(0,0,0,0.5); }
    .modal.show { display: block; }
    .modal-dialog { position: relative; width: auto; margin: 30px auto; max-width: 500px; }
    .modal-content { position: relative; display: flex; flex-direction: column; width: 100%; background-color: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid #dee2e6; border-top-left-radius: 16px; border-top-right-radius: 16px; }
    .modal-body { position: relative; padding: 24px; }
    .btn-close { width: 1em; height: 1em; background: transparent url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23000'%3e%3cpath d='M.293.293a1 1 0 011.414 0L8 6.586 14.293.293a1 1 0 111.414 1.414L9.414 8l6.293 6.293a1 1 0 01-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 01-1.414-1.414L6.586 8 .293 1.707a1 1 0 010-1.414z'/%3e%3c/svg%3e") center/1em auto no-repeat; border: 0; opacity: .5; cursor: pointer; }
    .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
    .form-control, .form-select { display: block; width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
    .form-label { font-weight: 600; font-size: 13px; color: #212529; display: block; margin-bottom: 5px; }
    .row { display: flex; gap: 15px; } .row > div { flex: 1; }
  </style>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dokter/jadwal-praktik.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>
<body>
  <div th:replace="layout/navbar :: navbar('jadwal-praktik')"></div>
  <div th:replace="fragments/overlay/notifikasi :: notifikasi-overlay"></div>

  <main class="rs-main-container">
    <div class="rs-page-header">
      <div class="rs-header-left">
        <h1 class="rs-title">Jadwal Praktik</h1>
        <span class="rs-subtitle">Kelola jadwal dan ketersediaan praktik Anda</span>
      </div>
      <button class="rs-btn rs-btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
        <i class="bi bi-plus-lg"></i> Tambah Jadwal
      </button>
    </div>

    <div th:if="${success}" class="alert alert-success" style="padding: 15px; background: #d4edda; color: #155724; border-radius: 8px; margin-bottom: 20px;">
      <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" style="padding: 15px; background: #f8d7da; color: #721c24; border-radius: 8px; margin-bottom: 20px;">
      <span th:text="${error}"></span>
    </div>

    <h2 class="rs-section-title" style="margin-bottom: 20px;">Semua Jadwal Praktik</h2>
    <div class="rs-table-panel">
      <table class="rs-table">
        <thead>
          <tr>
            <th>Hari</th>
            <th>Jam</th>
            <th>Poli</th>
            <th>Kuota</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${jadwals.empty}">
            <td colspan="6" style="text-align: center; padding: 20px;">Belum ada jadwal praktik.</td>
          </tr>
          <tr th:each="jadwal : ${jadwals}">
            <td class="rs-td-bold" th:text="${#strings.capitalize(#strings.toLowerCase(jadwal.hari))}">Hari</td>
            <td th:text="${#strings.substring(jadwal.jamMulai, 0, 5) + ' - ' + #strings.substring(jadwal.jamSelesai, 0, 5)}">Jam</td>
            <td th:text="${jadwal.dokter != null && jadwal.dokter.poli != null ? jadwal.dokter.poli.namaPoli : 'Poli Umum'}">Poli</td>
            <td th:text="${jadwal.kuota + ' Pasien'}">Kuota</td>
            <td>
              <span th:class="'rs-status-badge ' + ${#strings.toLowerCase(jadwal.statusKetersediaan == 'TERSEDIA' ? 'aktif' : (jadwal.statusKetersediaan == 'PENUH' ? 'penuh' : 'libur'))}"
                th:text="${jadwal.statusKetersediaan == 'TERSEDIA' ? 'Aktif' : (jadwal.statusKetersediaan == 'PENUH' ? 'Penuh' : 'Libur')}">Aktif</span>
            </td>
            <td>
              <div class="rs-action-group">
                <button class="rs-action-btn edit" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${jadwal.idJadwal}">
                  <i class="bi bi-pencil"></i>
                </button>
                <form th:action="@{/dokter/jadwal/delete/{id}(id=${jadwal.idJadwal})}" method="post" style="display: inline">
                  <button type="submit" class="rs-action-btn delete" onclick="return confirm('Hapus jadwal ini?');">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" style="background-color: var(--rs-primary); color: white;">
          <h5 style="margin:0; font-weight:700;">Tambah Jadwal</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form th:action="@{/dokter/jadwal/create}" method="post">
            <label class="form-label">Hari Praktik</label>
            <select class="form-select" name="hari" required>
              <option value="SENIN">Senin</option><option value="SELASA">Selasa</option>
              <option value="RABU">Rabu</option><option value="KAMIS">Kamis</option>
              <option value="JUMAT">Jumat</option><option value="SABTU">Sabtu</option>
              <option value="MINGGU">Minggu</option>
            </select>
            <div class="row">
              <div><label class="form-label">Jam Mulai</label><input type="time" class="form-control" name="jamMulai" required /></div>
              <div><label class="form-label">Jam Selesai</label><input type="time" class="form-control" name="jamSelesai" required /></div>
            </div>
            <label class="form-label">Kuota Pasien</label>
            <input type="number" class="form-control" name="kuota" min="1" required />
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
              <button type="button" class="rs-btn rs-btn-outline" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="rs-btn rs-btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
