<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Praktik - RSIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="/">RSIS</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/dokter/dashboard">Dashboard</a>
          <a class="nav-link active" href="/dokter/jadwal">Jadwal Praktik</a>
          <a class="nav-link" href="/dokter/daftar-pasien">Daftar Pasien</a>
          <a class="nav-link" href="/dokter/appointment/pending"
            >Appointment Pending</a
          >
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center"
            >
              <h3>Jadwal Praktik</h3>
              <button
                class="btn btn-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#createModal"
              >
                Tambah Jadwal
              </button>
            </div>
            <div class="card-body">
              <div
                th:if="${success}"
                class="alert alert-success"
                th:text="${success}"
              ></div>
              <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}"
              ></div>

              <div
                th:if="${jadwals == null or jadwals.empty}"
                class="alert alert-info"
              >
                Belum ada jadwal praktik.
              </div>

              <div th:if="${jadwals != null and !jadwals.empty}">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>Hari</th>
                      <th>Jam Mulai</th>
                      <th>Jam Selesai</th>
                      <th>Kuota</th>
                      <th>Sisa Kuota</th>
                      <th>Status</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="jadwal : ${jadwals}">
                      <td th:text="${jadwal.hari}"></td>
                      <td th:text="${jadwal.jamMulai}"></td>
                      <td th:text="${jadwal.jamSelesai}"></td>
                      <td th:text="${jadwal.kuota}"></td>
                      <td th:text="${jadwal.sisaKuota}"></td>
                      <td>
                        <span
                          class="badge"
                          th:class="'badge bg-' + (${jadwal.statusKetersediaan} == 'TERSEDIA' ? 'success' : 'danger')"
                          th:text="${jadwal.statusKetersediaan}"
                        ></span>
                      </td>
                      <td>
                        <button
                          class="btn btn-sm btn-warning"
                          data-bs-toggle="modal"
                          th:data-bs-target="'#editModal-' + ${jadwal.idJadwal}"
                        >
                          Edit
                        </button>
                        <form
                          th:action="@{/dokter/jadwal/delete/{id}(id=${jadwal.idJadwal})}"
                          method="post"
                          style="display: inline"
                        >
                          <button
                            type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Hapus jadwal ini?');"
                          >
                            Hapus
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Jadwal</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form
              th:action="@{/dokter/jadwal/create}"
              th:object="${jadwal}"
              method="post"
            >
              <div class="mb-3">
                <label for="hari" class="form-label">Hari</label>
                <select
                  class="form-select"
                  id="hari"
                  th:field="*{hari}"
                  required
                >
                  <option value="">-- Pilih Hari --</option>
                  <option value="SENIN">Senin</option>
                  <option value="SELASA">Selasa</option>
                  <option value="RABU">Rabu</option>
                  <option value="KAMIS">Kamis</option>
                  <option value="JUMAT">Jumat</option>
                  <option value="SABTU">Sabtu</option>
                  <option value="MINGGU">Minggu</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="jamMulai" class="form-label">Jam Mulai</label>
                <input
                  type="time"
                  class="form-control"
                  id="jamMulai"
                  th:field="*{jamMulai}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="jamSelesai" class="form-label">Jam Selesai</label>
                <input
                  type="time"
                  class="form-control"
                  id="jamSelesai"
                  th:field="*{jamSelesai}"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="kuota" class="form-label">Kuota</label>
                <input
                  type="number"
                  class="form-control"
                  id="kuota"
                  th:field="*{kuota}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
