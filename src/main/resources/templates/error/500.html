<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error 500</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
        }

        .error-box {
            background: #2d2d2d;
            border-left: 4px solid #e74c3c;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .highlight {
            background: #3d0000;
            border-left: 4px solid #ff4444;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            color: #ff6666;
        }

        .solution-box {
            background: #0d2d0d;
            border-left: 4px solid #2ecc71;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            color: #a8e6a8;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .trace-box {
            background: #111;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 0.75rem;
            color: #888;
            max-height: 300px;
            overflow-y: auto;
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 1.5rem;
        }

        h2 {
            color: #f39c12;
            font-size: 0.9rem;
            margin: 1.5rem 0 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            color: #aaa;
            font-size: 0.8rem;
        }

        p {
            margin: 0.2rem 0 0.8rem;
            font-size: 0.95rem;
        }

        .loading {
            color: #f39c12;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 3px;
            font-size: 0.75rem;
            margin-right: 0.4rem;
        }

        .badge-red {
            background: #e74c3c;
            color: white;
        }

        .badge-green {
            background: #2ecc71;
            color: #000;
        }

        details summary {
            cursor: pointer;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        details summary:hover {
            color: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>🔴 Internal Server Error (500)</h1>

    <div class="error-box">
        <label>URL</label>
        <p th:text="${path}">-</p>
        <label>Message</label>
        <p th:text="${message}">-</p>
        <label>Exception</label>
        <p th:text="${exception}">-</p>
    </div>

    <h2>🎯 Lokasi Error</h2>
    <div id="error-location" class="highlight">Menganalisis...</div>

    <h2>🤖 Solusi AI</h2>
    <div id="ai-solution" class="solution-box">
        <span class="loading">⏳ Menganalisis error dan mencari solusi...</span>
    </div>

    <details>
        <summary>📋 Lihat Full Stack Trace</summary>
        <div class="trace-box" id="trace" th:text="${trace}">No trace available</div>
    </details>

    <script th:inline="javascript">
        /*<![CDATA[*/

        const trace = [[${ trace }]] || '';
        const errorMessage = [[${ message }]] || '';
        const exception = [[${ exception }]] || '';
        const path = [[${ path }]] || '';

        // === Ekstrak lokasi error ===
        const lines = (trace || '').split('\n');
        const locationResults = [];

        lines.forEach(line => {
            const trimmed = line.trim();

            const templateMatch = trimmed.match(/template: "([^"]+)" - line (\d+), col (\d+)/);
            if (templateMatch) {
                locationResults.push(`📄 Template : ${templateMatch[1]}.html\n🔢 Baris    : ${templateMatch[2]}, Kolom: ${templateMatch[3]}`);
            }

            if (trimmed.startsWith('Caused by:')) {
                locationResults.push(`💥 ${trimmed}`);
            }

            const javaMatch = trimmed.match(/at rsis\.(controller|service|model|repository)\.([\S]+)\(([\S]+\.java):(\d+)\)/);
            if (javaMatch) {
                locationResults.push(`☕ ${javaMatch[1].toUpperCase()} : ${javaMatch[2]}\n📁 File     : ${javaMatch[3]}, Baris: ${javaMatch[4]}`);
            }
        });

        const locationEl = document.getElementById('error-location');
        if (locationResults.length > 0) {
            locationEl.innerText = [...new Set(locationResults)].join('\n\n');
        } else if (message) {
            locationEl.innerText = message;
        } else {
            locationEl.innerText = 'Tidak dapat mengekstrak lokasi error.';
        }

        // === Rule-based analyzer ===
        function getAISolution() {
            const solutionEl = document.getElementById('ai-solution');
            const fullText = `${exception || ''} ${message || ''} ${trace || ''}`;

            if (!fullText.trim()) {
                solutionEl.innerText = '⚠️ Tidak ada data error yang bisa dianalisis.';
                return;
            }

            const rules = [
                {
                    pattern: /Could not parse as expression/i,
                    penyebab: 'Syntax expression Thymeleaf tidak valid di dalam th:* attribute.',
                    lokasi: () => extractTemplateLine(),
                    solusi: `Kemungkinan ada \${} di dalam th:class/th:href/th:src.

❌ SALAH:
th:class="'badge-' + (\${status} == 'X' ? 'a' : 'b')"

✅ BENAR:
th:class="\${'badge-' + (status == 'X' ? 'a' : 'b')}"`,
                    tips: "Gunakan satu \${} yang membungkus seluruh expression dari awal sampai akhir."
                },
                {
                    pattern: /Property or field '(\w+)' cannot be found on object of type '([\w.]+)'/i,
                    penyebab: (m) => `Field '${m[1]}' tidak ditemukan di class '${m[2]}'. Mungkin sudah dihapus atau rename setelah migrasi.`,
                    lokasi: () => extractTemplateLine(),
                    solusi: (m) => `1. Cek apakah field '${m[1]}' masih ada di ${m[2]}.java
2. Pastikan getter-nya public: get${m[1].charAt(0).toUpperCase() + m[1].slice(1)}()
3. Ganti di template dengan nama field yang benar.`,
                    tips: "Setelah refactor entity, cari semua penggunaan field lama di template dengan: grep -r \"fieldLama\" src/main/resources/templates/"
                },
                {
                    pattern: /EntityNotFoundException|Unable to find (\S+) with id/i,
                    penyebab: 'Entity tidak ditemukan di database. ID yang dicari tidak ada atau foreign key tidak match.',
                    lokasi: () => extractJavaLine(),
                    solusi: `1. Cek data di database — pastikan ID-nya ada.
2. Gunakan Optional di repository:

Optional<Dokter> dokter = dokterRepository.findById(id);
dokter.orElseThrow(() -> new RuntimeException("Not found: " + id));

3. Cek apakah ada data orphan di tabel relasi.`,
                    tips: "Selalu gunakan Optional<> dan handle not found dengan pesan yang jelas."
                },
                {
                    pattern: /LazyInitializationException/i,
                    penyebab: 'Mengakses relasi lazy-loaded di luar Hibernate session.',
                    lokasi: () => extractJavaLine(),
                    solusi: `Pilih salah satu solusi:
1. Tambah @Transactional di method service.
2. Gunakan JOIN FETCH di query:
   @Query("SELECT j FROM JadwalPraktik j JOIN FETCH j.dokter")
3. Ganti ke FetchType.EAGER (hati-hati performa).`,
                    tips: "Lebih baik JOIN FETCH di query spesifik daripada EAGER secara global."
                },
                {
                    pattern: /DataIntegrityViolationException|ConstraintViolationException/i,
                    penyebab: 'Pelanggaran constraint database — duplikat data, nilai null, atau foreign key violation.',
                    lokasi: () => extractJavaLine(),
                    solusi: `1. Cek log untuk detail: "Duplicate entry" atau "cannot be null".
2. Validasi data sebelum save():
   if (repository.existsByEmail(email)) { ... }
3. Pastikan urutan insert: parent dulu, baru child.`,
                    tips: "Tambahkan validasi di service layer sebelum memanggil repository.save()."
                },
                {
                    pattern: /NullPointerException/i,
                    penyebab: 'Mengakses method atau property dari object yang bernilai null.',
                    lokasi: () => extractJavaLine(),
                    solusi: `Tambahkan null check:

if (obj != null && obj.getField() != null) {
    // aman diakses
}

// Atau gunakan Optional:
Optional.ofNullable(obj).map(Obj::getField).orElse(null)`,
                    tips: "Validasi semua input dan hasil query sebelum digunakan."
                },
                {
                    pattern: /AccessDeniedException|403/i,
                    penyebab: 'User tidak memiliki role yang diperlukan untuk mengakses endpoint ini.',
                    lokasi: () => extractJavaLine(),
                    solusi: `Cek SecurityConfig:
.requestMatchers("/admin/**").hasRole("ADMIN_RS")
.requestMatchers("/pasien/**").hasRole("PASIEN")

Pastikan role user di database sesuai dengan konfigurasi.`,
                    tips: "Gunakan Spring Security test untuk verifikasi konfigurasi akses."
                },
                {
                    pattern: /TemplateInputException/i,
                    penyebab: 'Error terjadi saat Thymeleaf memproses template HTML.',
                    lokasi: () => extractTemplateLine(),
                    solusi: `Buka file template di lokasi yang disebutkan dan periksa:
1. Syntax th:* attribute di baris yang error.
2. Variable yang diakses apakah masih ada di model/entity.
3. Tambahkan null check: \${obj != null ? obj.field : 'default'}`,
                    tips: "Validasi nama field di template setiap kali ada perubahan di entity."
                },
            ];

            function extractTemplateLine() {
                const match = trace.match(/template: "([^"]+)" - line (\d+), col (\d+)/);
                return match ? `${match[1]}.html — baris ${match[2]}, kolom ${match[3]}` : 'Lihat stack trace';
            }

            function extractJavaLine() {
                const match = trace.match(/at rsis\.([\w.]+)\((\w+\.java):(\d+)\)/);
                return match ? `${match[1]} — ${match[2]} baris ${match[3]}` : 'Lihat stack trace';
            }

            for (const rule of rules) {
                const match = fullText.match(rule.pattern);
                if (match) {
                    const penyebab = typeof rule.penyebab === 'function' ? rule.penyebab(match) : rule.penyebab;
                    const lokasi = rule.lokasi();
                    const solusi = typeof rule.solusi === 'function' ? rule.solusi(match) : rule.solusi;

                    solutionEl.innerText =
                        `1. PENYEBAB:
${penyebab}

2. LOKASI:
${lokasi}

3. SOLUSI:
${solusi}

4. TIPS:
${rule.tips}`;
                    return;
                }
            }

            solutionEl.innerText =
                `Tidak ada rule yang cocok untuk error ini.

Exception : ${exception || '-'}
Message   : ${message || '-'}

Cek stack trace di bawah untuk detail lebih lanjut.`;
        }

        getAISolution();

        /*]]>*/
    </script>

</body>

</html>
