<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="login-form">
    
    <div class="auth-alert auth-alert--error" th:if="${errorMessage}" th:text="${errorMessage}">
    </div>

    <div
      class="auth-alert auth-alert--success"
      th:if="${hasRegistered}"
    >
      Registrasi berhasil. Silakan login.
    </div>
    <div class="auth-alert auth-alert--info" th:if="${hasLogout}">
      Kamu sudah logout.
    </div>

    <form class="login-form" method="post" action="/login" onsubmit="const btn = this.querySelector('button[type=submit]'); btn.disabled = true; btn.style.opacity = '0.7'; btn.innerText = 'Memproses...';">
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      />
      <label>Email</label>
      <div class="field-group">
        <input
          type="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          required
          pattern="^[^@]+@gmail\.com$"
          title="Email harus menggunakan domain @gmail.com"
        />
      </div>

      <label>Kata Sandi</label>
      <div class="field-group">
        <input
          type="password"
          name="password"
          placeholder="Kata Sandi"
          autocomplete="current-password"
          required
          minlength="8"
        />
        <button
          type="button"
          class="password-toggle"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-open"
            style="display: none"
          >
            <path
              d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
            ></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-closed"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
        <input type="checkbox" id="remember-me" name="remember-me" style="width: auto; cursor: pointer;">
        <label for="remember-me" style="font-size: 14px; cursor: pointer; margin: 0;">Ingat Saya</label>
      </div>

      <button class="btn-login" type="submit">Masuk</button>
    </form>
  </div>
</body>
</html>
