<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="register-form">
    <div class="auth-alert auth-alert--error" th:if="${errorMessage}">
      <span th:text="${errorMessage}"></span>
    </div>

    <form class="login-form" method="post" action="/register">
      <input
        type="hidden"
        th:name="${_csrf.parameterName}"
        th:value="${_csrf.token}"
      />

      <label>Nama Lengkap</label>
      <div class="field-group">
        <input
          type="text"
          name="namaLengkap"
          placeholder="Masukkan nama lengkap"
          required
          th:value="${form != null ? form.namaLengkap() : ''}"
        />
      </div>

      <label>Email</label>
      <div class="field-group">
        <input
          type="email"
          name="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
          pattern="^[^@]+@gmail\.com$"
          title="Email harus menggunakan domain @gmail.com"
          th:value="${form != null ? form.email() : ''}"
        />
      </div>

      <label>Kata Sandi</label>
      <div class="field-group">
        <input
          type="password"
          name="password"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          minlength="8"
          id="password-input"
        />
        <button
          type="button"
          class="password-toggle"
          id="password-toggle"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-open"
            style="display: none"
          >
            <path
              d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
            ></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-closed"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <label>Konfirmasi Kata Sandi</label>
      <div class="field-group">
        <input
          type="password"
          name="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          minlength="8"
          id="confirm-password-input"
        />
        <button
          type="button"
          class="password-toggle"
          id="confirm-password-toggle"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-open"
            style="display: none"
          >
            <path
              d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
            ></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="eye-closed"
          >
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
            ></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <button class="btn-login" type="submit">Daftar</button>
    </form>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Password toggle for password field
        const passwordToggle = document.getElementById('password-toggle');
        const passwordInput = document.getElementById('password-input');
        const eyeOpen = passwordToggle.querySelector('.eye-open');
        const eyeClosed = passwordToggle.querySelector('.eye-closed');

        passwordToggle.addEventListener('click', function() {
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
          } else {
            passwordInput.type = 'password';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
          }
        });

        // Password toggle for confirm password field
        const confirmPasswordToggle = document.getElementById('confirm-password-toggle');
        const confirmPasswordInput = document.getElementById('confirm-password-input');
        const confirmEyeOpen = confirmPasswordToggle.querySelector('.eye-open');
        const confirmEyeClosed = confirmPasswordToggle.querySelector('.eye-closed');

        confirmPasswordToggle.addEventListener('click', function() {
          if (confirmPasswordInput.type === 'password') {
            confirmPasswordInput.type = 'text';
            confirmEyeOpen.style.display = 'block';
            confirmEyeClosed.style.display = 'none';
          } else {
            confirmPasswordInput.type = 'password';
            confirmEyeOpen.style.display = 'none';
            confirmEyeClosed.style.display = 'block';
          }
        });
      });
    </script>
  </div>
</body>
</html>
