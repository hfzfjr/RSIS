<div th:fragment="overlay" xmlns:th="http://www.thymeleaf.org">
    <div class="overlay" id="editJadwalOverlay">
        <div class="overlay-content edit-modal">
            <div class="overlay-header">
                <h2>Edit Jadwal Praktik Dokter</h2>
                <button class="close-btn" onclick="closeEditJadwalOverlay()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form class="jadwal-form" id="editJadwalForm">
                <!-- ID Jadwal (Hidden) -->
                <input type="hidden" id="edit_idJadwal" name="idJadwal">

                <!-- Row 1: Dokter & Poli (2 Columns) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_idUser">Dokter</label>
                        <select id="edit_idUser" name="idUser" required>
                            <option value="">Pilih Dokter</option>
                            <option th:each="dokter : ${dokters}"
                                    th:value="${dokter.idUser}"
                                    th:data-poli-id="${dokter.poli != null ? dokter.poli.idPoli : ''}"
                                    th:text="${dokter.nama}">Nama Dokter</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit_idPoli">Poli</label>
                        <select id="edit_idPoli" name="idPoli" required>
                            <option value="">Pilih Poli</option>
                            <option th:each="poli : ${polis}"
                                    th:value="${poli.idPoli}"
                                    th:text="${poli.namaPoli}">Nama Poli</option>
                        </select>
                    </div>
                </div>

                <!-- Row 2: Hari & Tanggal (2 Columns) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_hari">Hari</label>
                        <select id="edit_hari" name="hari" required>
                            <option value="">Pilih Hari</option>
                            <option value="SENIN">Senin</option>
                            <option value="SELASA">Selasa</option>
                            <option value="RABU">Rabu</option>
                            <option value="KAMIS">Kamis</option>
                            <option value="JUMAT">Jumat</option>
                            <option value="SABTU">Sabtu</option>
                            <option value="MINGGU">Minggu</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit_tanggal">Tanggal (Opsional)</label>
                        <input type="date" id="edit_tanggal" name="tanggal">
                    </div>
                </div>

                <!-- Row 3: Jam Mulai & Jam Selesai (2 Columns) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_jamMulai">Jam Mulai</label>
                        <input type="time" id="edit_jamMulai" name="jamMulai" required step="60">
                    </div>

                    <div class="form-group">
                        <label for="edit_jamSelesai">Jam Selesai</label>
                        <input type="time" id="edit_jamSelesai" name="jamSelesai" required step="60">
                    </div>
                </div>

                <!-- Row 4: Status & Kuota (2 Columns) -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit_statusKetersediaan">Status Ketersediaan</label>
                        <select id="edit_statusKetersediaan" name="statusKetersediaan" required>
                            <option value="TERSEDIA">Tersedia</option>
                            <option value="LIBUR">Libur</option>
                            <option value="PENUH">Penuh</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="edit_kuota">Kuota Kapasitas</label>
                        <input type="number" id="edit_kuota" name="kuota" required min="1" placeholder="Masukkan Kuota">
                    </div>
                </div>

                <!-- Footer / Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEditJadwalOverlay()">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Automatic Poli dropdown update when Dokter is changed
        document.getElementById('edit_idUser').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const poliId = selectedOption.getAttribute('data-poli-id');
            if (poliId) {
                document.getElementById('edit_idPoli').value = poliId;
            }
        });

        // Handle form submission with AJAX
        document.getElementById('editJadwalForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const params = new URLSearchParams(formData);

            fetch('/admin/jadwal/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            })
            .then(response => {
                if (response.ok) {
                    // Close overlay
                    closeEditJadwalOverlay();
                    
                    // Show success notification if available
                    if (typeof showNotification !== 'undefined') {
                        showNotification('Jadwal berhasil diperbarui!', 'success');
                    }
                    
                    // Reload halaman untuk menampilkan data terbaru
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    throw new Error('Gagal memperbarui jadwal');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if (typeof showNotification !== 'undefined') {
                    showNotification('Gagal memperbarui jadwal', 'error');
                } else {
                    alert('Gagal memperbarui jadwal: ' + error.message);
                }
            });
        });

        function openEditJadwalOverlay(btn) {
            const id = btn.getAttribute('data-id');
            const dokterId = btn.getAttribute('data-dokter-id');
            const hari = btn.getAttribute('data-hari');
            const tanggal = btn.getAttribute('data-tanggal');
            const jamMulai = btn.getAttribute('data-jam-mulai');
            const jamSelesai = btn.getAttribute('data-jam-selesai');
            const status = btn.getAttribute('data-status-ketersediaan');
            const kuota = btn.getAttribute('data-kuota');

            document.getElementById('edit_idJadwal').value = id;
            document.getElementById('edit_idUser').value = dokterId;
            document.getElementById('edit_hari').value = hari;
            
            // Format jamMulai and jamSelesai to HH:MM if they contain seconds (like HH:MM:SS)
            const formatTime = (timeStr) => {
                if (!timeStr) return '';
                const parts = timeStr.split(':');
                if (parts.length >= 2) {
                    return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                }
                return timeStr;
            };

            document.getElementById('edit_jamMulai').value = formatTime(jamMulai);
            document.getElementById('edit_jamSelesai').value = formatTime(jamSelesai);
            
            // Set tanggal
            document.getElementById('edit_tanggal').value = tanggal ? tanggal : '';
            
            // Set status
            document.getElementById('edit_statusKetersediaan').value = status;
            
            // Set kuota
            document.getElementById('edit_kuota').value = kuota;

            // Trigger change to update the Poli selector correctly
            const dokterSelect = document.getElementById('edit_idUser');
            const selectedOption = dokterSelect.options[dokterSelect.selectedIndex];
            if (selectedOption) {
                const poliId = selectedOption.getAttribute('data-poli-id');
                if (poliId) {
                    document.getElementById('edit_idPoli').value = poliId;
                }
            }

            document.getElementById('editJadwalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEditJadwalOverlay() {
            document.getElementById('editJadwalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close overlay when clicking outside modal
        document.getElementById('editJadwalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditJadwalOverlay();
            }
        });

        // Close overlay with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEditJadwalOverlay();
            }
        });
    </script>
</div>
