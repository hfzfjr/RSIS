<div th:fragment="overlay" xmlns:th="http://www.thymeleaf.org">
    <div class="overlay" id="tambahDokterOverlay">
        <div class="overlay-content">
            <div class="overlay-header">
                <h2>Tambah Dokter Baru</h2>
                <button class="close-btn" onclick="closeTambahDokterOverlay()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form th:action="@{/admin/dokter/create}" method="post" enctype="multipart/form-data" class="dokter-form" id="tambahDokterForm">
                <!-- Kolom Kiri: Informasi Pribadi -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap dengan gelar">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="contoh@rsis.com">
                    </div>

                    <div class="form-group">
                        <label for="nomorHp">Nomor HP</label>
                        <input type="tel" id="nomorHp" name="nomorHp" placeholder="08xxxxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Buat password sementara" minlength="8">
                    </div>
                </div>

                <!-- Kolom Kanan: Informasi Profesional -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="spesialisasi">Spesialisasi</label>
                        <select id="spesialisasi" name="spesialisasi" required>
                            <option value="">Pilih Spesialisasi</option>
                            <option th:each="spesialisasi : ${spesialisasis}"
                                    th:value="${spesialisasi.idSpesialisasi}"
                                    th:text="${spesialisasi.nama}">Spesialisasi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="poli">Poli</label>
                        <select id="poli" name="poli" required>
                            <option value="">Pilih Poli</option>
                            <option th:each="poli : ${polis}"
                                    th:value="${poli.idPoli}"
                                    th:text="${poli.namaPoli}">Poli</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Upload Foto</label>
                        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('dokterImage').click()">
                            <svg class="upload-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.2 15c.7-1.2 1-2.5.7-3.9-.5-2-2.4-3.5-4.5-3.5h-1.3C15.3 4.8 12.8 3 10 3 6.7 3 4 5.7 4 9c0 .4.1.8.2 1.2C2.1 11.2 1 13 1 15c0 2.8 2.2 5 5 5h13c2.2 0 4-1.8 4-4a3.9 3.9 0 0 0-.8-1z"></path>
                                <polyline points="16 12 12 8 8 12"></polyline>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                            </svg>
                            <p class="upload-main-text">
                                Tarik & lepas foto ke sini atau <span class="upload-link">pilih file</span>
                            </p>
                            <p class="upload-hint">Maks. ukuran file 2MB (JPG, PNG)</p>
                            <input type="file" id="dokterImage" name="dokterImage" accept="image/jpeg,image/png,image/jpg" style="display: none;" onchange="handleFileSelect(this)">
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeTambahDokterOverlay()">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openTambahDokterOverlay() {
            document.getElementById('tambahDokterOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            initializeUploadZone();
        }

        function closeTambahDokterOverlay() {
            document.getElementById('tambahDokterOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('tambahDokterForm').reset();
            // Reset upload zone text
            const mainText = document.querySelector('#uploadZone .upload-main-text');
            if (mainText) {
                mainText.innerHTML = 'Tarik & lepas foto ke sini atau <span class="upload-link">pilih file</span>';
            }
        }

        // Close overlay when clicking outside
        document.getElementById('tambahDokterOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTambahDokterOverlay();
            }
        });

        // Close overlay with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeTambahDokterOverlay();
            }
        });

        function handleFileSelect(input) {
            const uploadZone = document.getElementById('uploadZone');
            const mainText = uploadZone.querySelector('.upload-main-text');
            if (input.files && input.files[0]) {
                const fileName = input.files[0].name;
                mainText.innerHTML = `File terpilih: <span class="upload-link" style="text-decoration: none;">${fileName}</span>`;
            } else {
                mainText.innerHTML = 'Tarik & lepas foto ke sini atau <span class="upload-link">pilih file</span>';
            }
        }

        function initializeUploadZone() {
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('dokterImage');

            if (!uploadZone || !fileInput || uploadZone.dataset.initialized === 'true') {
                return;
            }

            uploadZone.dataset.initialized = 'true';

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // Highlight drop zone when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                uploadZone.addEventListener(eventName, () => uploadZone.classList.add('dragover'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('dragover'), false);
            });

            // Handle dropped files
            uploadZone.addEventListener('drop', handleDrop, false);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length) {
                    fileInput.files = files;
                    handleFileSelect(fileInput);
                }
            }
        }
    </script>
</div>
