<div th:fragment="notifikasi-overlay" class="notifikasi-overlay" id="notifikasiOverlay">
  <div class="notifikasi-content">
    <div class="notifikasi-header">
      <h3 class="notifikasi-title">Notifikasi</h3>
      <button class="notifikasi-close" id="closeNotifikasi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="notifikasi-body">
      <th:block th:if="${notifikasi != null and notifikasi.size() > 0}">
        <div class="notifikasi-list">
          <div th:each="notif : ${notifikasi}" class="notifikasi-item"
            th:classappend="${notif.status == false} ? 'unread' : ''"
            th:attr="data-id=${notif.idNotifikasi}, data-status=${notif.status}" onclick="markNotifikasiAsRead(this)">
            <div class="notifikasi-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </div>
            <div class="notifikasi-message">
              <p class="notifikasi-text" th:text="${notif.pesan}">Pesan notifikasi</p>
              <span class="notifikasi-time"
                th:text="${#temporals.format(notif.tanggalKirim, 'dd MMM yyyy, HH:mm')}">10:30</span>
            </div>
            <div th:if="${notif.status == false}" class="notifikasi-badge"></div>
          </div>
        </div>
      </th:block>
      <th:block th:if="${notifikasi == null or notifikasi.size() == 0}">
        <div class="notifikasi-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <p>Tidak ada notifikasi baru</p>
        </div>
      </th:block>
    </div>
  </div>
</div>
