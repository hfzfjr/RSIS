<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Detail Riwayat Booking</title>
    <link rel="stylesheet" href="/css/fragments/overlay/pasien/detail-riwayat-booking.css" />
</head>

<body>
    <div id="detail-overlay" class="overlay">
        <div class="overlay-content">
            <div class="overlay-header">
                <h2 class="overlay-title">Detail Booking</h2>
                <button class="overlay-close" onclick="closeOverlay()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="overlay-body">
                <!-- Timeline Status -->
                <div class="timeline-section">
                    <div class="timeline">
                        <div class="timeline-step" data-status="MENUNGGU">
                            <div class="timeline-dot"></div>
                            <div class="timeline-label">Menunggu</div>
                        </div>
                        <div class="timeline-line"></div>
                        <div class="timeline-step" data-status="DIKONFIRMASI">
                            <div class="timeline-dot"></div>
                            <div class="timeline-label">Dikonfirmasi</div>
                        </div>
                        <div class="timeline-line"></div>
                        <div class="timeline-step" data-status="SELESAI">
                            <div class="timeline-dot"></div>
                            <div class="timeline-label">Selesai</div>
                        </div>
                    </div>
                </div>

                <!-- Doctor Info -->
                <div class="info-section">
                    <h4 class="section-title">👨‍⚕️ Informasi Dokter</h4>
                    <div class="doctor-card">
                        <div class="doctor-avatar">
                            <img id="overlay-doctor-image" src="/images/dokter.png" alt="Dokter" />
                        </div>
                        <div class="doctor-details">
                            <h3 id="overlay-doctor-name" class="doctor-name">Nama Dokter</h3>
                            <p id="overlay-doctor-specialty" class="doctor-specialty">Spesialis</p>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Nomor STR</span>
                        <span id="overlay-str" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Poli</span>
                        <span id="overlay-poli" class="detail-value">-</span>
                    </div>
                </div>

                <!-- Appointment Info -->
                <div class="info-section">
                    <h4 class="section-title">📋 Informasi Appointment</h4>
                    <div class="detail-row">
                        <span class="detail-label">ID Appointment</span>
                        <span id="overlay-id-appointment" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Nomor Antrian</span>
                        <span id="overlay-nomor-antrian" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span id="overlay-status" class="detail-value status-badge">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Tanggal Booking</span>
                        <span id="overlay-tanggal-booking" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Keluhan</span>
                        <span id="overlay-keluhan" class="detail-value">-</span>
                    </div>
                </div>

                <!-- Schedule Info -->
                <div class="info-section">
                    <h4 class="section-title">🕐 Informasi Jadwal</h4>
                    <div class="detail-row">
                        <span class="detail-label">Hari</span>
                        <span id="overlay-hari" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Tanggal Praktik</span>
                        <span id="overlay-tanggal-praktik" class="detail-value">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Jam</span>
                        <span id="overlay-jam" class="detail-value">-</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="overlay-actions">
                    <button class="btn btn-close-overlay" onclick="closeOverlay()">
                        Tutup
                    </button>
                    <button id="btn-batal" class="btn btn-danger btn-batal" style="display: none;">
                        Batalkan Booking
                    </button>
                    <button id="btn-reschedule" class="btn btn-secondary btn-reschedule" style="display: none;">
                        Reschedule
                    </button>
                    <button id="btn-booking-lagi" class="btn btn-primary btn-booking-lagi" style="display: none;">
                        Booking Lagi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/

        function openOverlay(appointmentId) {
            fetch(`/pasien/appointment/detail/${appointmentId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const appointment = data.appointment;

                        // Update timeline status
                        updateTimeline(appointment.status);

                        // Update doctor info
                        document.getElementById('overlay-doctor-name').textContent =
                            appointment.jadwal?.dokter?.nama || 'N/A';
                        document.getElementById('overlay-doctor-specialty').textContent =
                            appointment.jadwal?.dokter?.spesialisasi?.nama
                                ? 'Spesialis ' + appointment.jadwal.dokter.spesialisasi.nama
                                : 'Spesialis';
                        document.getElementById('overlay-doctor-image').src =
                            appointment.jadwal?.dokter?.dokterImage || '/images/dokter.png';
                        document.getElementById('overlay-str').textContent =
                            appointment.jadwal?.dokter?.nomorStr || '-';
                        document.getElementById('overlay-poli').textContent =
                            appointment.jadwal?.dokter?.poli?.namaPoli || '-';

                        // Update appointment info
                        document.getElementById('overlay-id-appointment').textContent =
                            appointment.idAppointment || '-';
                        document.getElementById('overlay-nomor-antrian').textContent =
                            appointment.nomorAntrian || '-';
                        const statusElement = document.getElementById('overlay-status');
                        statusElement.textContent = appointment.status || '-';
                        statusElement.className = 'detail-value status-badge ' + getStatusClass(appointment.status);
                        document.getElementById('overlay-tanggal-booking').textContent =
                            appointment.tanggalBooking || '-';
                        document.getElementById('overlay-keluhan').textContent =
                            appointment.catatan || '-';

                        // Update schedule info
                        document.getElementById('overlay-hari').textContent =
                            appointment.jadwal?.hari || '-';
                        document.getElementById('overlay-tanggal-praktik').textContent =
                            appointment.jadwal?.tanggal || '-';
                        const jamMulai = appointment.jadwal?.jamMulai || '-';
                        const jamSelesai = appointment.jadwal?.jamSelesai || '-';
                        document.getElementById('overlay-jam').textContent =
                            jamMulai !== '-' && jamSelesai !== '-' ? `${jamMulai} - ${jamSelesai}` : jamMulai;

                        // Show/hide buttons based on status and date
                        const btnBookingLagi = document.getElementById('btn-booking-lagi');
                        const btnReschedule = document.getElementById('btn-reschedule');
                        const btnBatal = document.getElementById('btn-batal');

                        btnBookingLagi.style.display = 'none';
                        btnReschedule.style.display = 'none';
                        btnBatal.style.display = 'none';

                        if (appointment.status === 'SELESAI' || appointment.status === 'DIBATALKAN') {
                            btnBookingLagi.style.display = 'inline-flex';
                            btnBookingLagi.onclick = () => window.location.href = '/pasien/cari-dokter';
                        } else if (appointment.status === 'MENUNGGU' || appointment.status === 'DIKONFIRMASI') {
                            btnReschedule.style.display = 'inline-flex';
                            btnReschedule.onclick = () => window.location.href = `/pasien/booking/reschedule/${appointment.idAppointment}`;

                            // Check if can cancel (H-1 or more)
                            const jadwalDate = new Date(appointment.jadwal?.tanggal);
                            const today = new Date();
                            today.setHours(0, 0, 0, 0);
                            const diffTime = jadwalDate - today;
                            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                            if (diffDays >= 1) {
                                btnBatal.style.display = 'inline-flex';
                                btnBatal.onclick = () => cancelAppointment(appointment.idAppointment);
                            }
                        }

                        // Show overlay
                        document.getElementById('detail-overlay').classList.add('active');
                    } else {
                        alert('Gagal memuat detail booking: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Terjadi kesalahan saat memuat detail booking');
                });
        }

        function updateTimeline(status) {
            const steps = document.querySelectorAll('.timeline-step');
            const statusOrder = ['MENUNGGU', 'DIKONFIRMASI', 'SELESAI'];
            const currentIndex = statusOrder.indexOf(status);

            steps.forEach((step, index) => {
                const stepStatus = step.getAttribute('data-status');
                const dot = step.querySelector('.timeline-dot');

                if (index <= currentIndex) {
                    step.classList.add('active');
                    if (index === currentIndex) {
                        dot.classList.add('current');
                    }
                } else {
                    step.classList.remove('active');
                    dot.classList.remove('current');
                }
            });
        }

        function closeOverlay() {
            document.getElementById('detail-overlay').classList.remove('active');
        }

        function cancelAppointment(appointmentId) {
            if (confirm('Apakah Anda yakin ingin membatalkan booking ini?')) {
                fetch(`/appointment/cancel/${appointmentId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Booking berhasil dibatalkan');
                            closeOverlay();
                            location.reload();
                        } else {
                            alert('Gagal membatalkan booking: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Terjadi kesalahan saat membatalkan booking');
                    });
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'MENUNGGU':
                    return 'status-menunggu';
                case 'DIKONFIRMASI':
                    return 'status-dikonfirmasi';
                case 'SELESAI':
                    return 'status-selesai';
                case 'DITOLAK':
                    return 'status-ditolak';
                case 'DIBATALKAN':
                    return 'status-dibatalkan';
                default:
                    return 'status-menunggu';
            }
        }

        // Close overlay when clicking outside
        document.getElementById('detail-overlay').addEventListener('click', function (e) {
            if (e.target === this) {
                closeOverlay();
            }
        });

        /*]]>*/
    </script>
</body>

</html>
