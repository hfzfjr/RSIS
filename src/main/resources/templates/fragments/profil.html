<th:block th:fragment="profil">
  <main class="profil-main">

    <!-- ===== CARD 1: PROFILE HEADER ===== -->
    <div class="profil-card profil-header-card">
      <div class="profil-header-inner">
        <div class="profil-avatar-wrap">
          <div class="profil-avatar-initials" th:text="${role == 'PASIEN' ? 'P' : (role == 'DOKTER' ? 'D' : 'A')}">P</div>
        </div>
        <div class="profil-header-info">
          <h1 class="profil-nama" th:text="${nama}">Nama User</h1>
          <p class="profil-email" th:text="${email}">email@example.com</p>
          <p class="profil-id" th:text="'ID: ' + ${idUser}">ID: RS-2022-8812</p>
        </div>
        <div class="profil-header-action">
          <a href="/auth?tab=login&logout" class="btn-logout">Logout</a>
        </div>
      </div>
    </div>

    <!-- ===== CARD 2: INFORMASI PRIBADI ===== -->
    <div class="profil-card">
      <div class="profil-card-header">
        <h2 class="profil-card-title">Informasi Pribadi</h2>
        <button type="submit" form="formInfoPribadi" class="btn-simpan">Simpan Perubahan</button>
      </div>

      <form id="formInfoPribadi" class="profil-form"
        th:action="${role == 'PASIEN' ? '/pasien/profil' : (role == 'DOKTER' ? '/dokter/profil' : '/admin/profil')}"
        method="post">

        <!-- CSRF token (Spring Security) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Row 1: Nama + Nomor Telepon (semua role) -->
        <div class="profil-form-row">
          <div class="profil-form-group">
            <label for="namaLengkap">Nama Lengkap</label>
            <input type="text" id="namaLengkap" name="namaLengkap" class="profil-input" th:value="${nama}"
              placeholder="Masukkan nama lengkap" />
          </div>
          <div class="profil-form-group">
            <label for="nomorTelepon">Nomor Telepon</label>
            <input type="text" id="nomorTelepon" name="nomorTelepon" class="profil-input" th:value="${nomorHp}"
              placeholder="Contoh: +62 812 3456 7890" />
          </div>
        </div>

        <!-- Row 2 PASIEN: Tanggal Lahir + Nomor Rekam Medis -->
        <div class="profil-form-row" th:if="${role == 'PASIEN'}">
          <div class="profil-form-group">
            <label for="tanggalLahir">Tanggal Lahir</label>
            <input type="text" id="tanggalLahir" name="tanggalLahir" class="profil-input" th:value="${tanggalLahir}"
              placeholder="DD/MM/YYYY" />
          </div>
          <div class="profil-form-group">
            <label for="nomorRekamMedis">Nomor Rekam Medis</label>
            <input type="text" id="nomorRekamMedis" name="nomorRekamMedis" class="profil-input profil-input-readonly"
              th:value="${nomorRekamMedis}" readonly />
          </div>
          <div class="profil-form-group profil-form-group-full">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" name="alamat" class="profil-textarea" rows="3" th:text="${alamat}"
              placeholder="Masukkan alamat lengkap"></textarea>
          </div>
        </div>

        <!-- Row 2 DOKTER: Spesialisasi + Poli + Nomor STR -->
        <div class="profil-form-row" th:if="${role == 'DOKTER'}">
          <div class="profil-form-group">
            <label for="spesialisasi">Spesialisasi</label>
            <input type="text" id="spesialisasi" name="spesialisasi" class="profil-input profil-input-readonly"
              th:value="${spesialisasi}" readonly />
          </div>
          <div class="profil-form-group">
            <label for="poli">Poli</label>
            <input type="text" id="poli" name="poli" class="profil-input profil-input-readonly" th:value="${poli}"
              readonly />
          </div>
          <div class="profil-form-group">
            <label for="nomorStr">Nomor STR</label>
            <input type="text" id="nomorStr" name="nomorStr" class="profil-input profil-input-readonly"
              th:value="${nomorStr}" readonly />
          </div>
        </div>

        <!-- Row 2 ADMIN_RS: Jabatan -->
        <div class="profil-form-row" th:if="${role == 'ADMIN_RS'}">
          <div class="profil-form-group">
            <label for="jabatan">Jabatan</label>
            <input type="text" id="jabatan" name="jabatan" class="profil-input profil-input-readonly"
              th:value="${jabatan}" readonly />
          </div>
        </div>
      </form>
    </div>

    <!-- ===== CARD 3: GANTI PASSWORD ===== -->
    <div class="profil-card">
      <div class="profil-card-header">
        <h2 class="profil-card-title">Ganti Password</h2>
        <button type="submit" form="formGantiPassword" class="btn-simpan">Simpan Perubahan</button>
      </div>

      <form id="formGantiPassword" class="profil-form"
        th:action="${role == 'PASIEN' ? '/pasien/profil/password' : (role == 'DOKTER' ? '/dokter/profil/password' : '/admin/profil/password')}"
        method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="profil-form-group profil-form-group-full">
          <label for="passwordLama">Masukkan kata sandi lama</label>
          <input type="password" id="passwordLama" name="passwordLama" class="profil-input"
            placeholder="••••••••••••••" />
        </div>

        <div class="profil-form-group profil-form-group-full">
          <label for="passwordBaru">Masukkan kata sandi baru</label>
          <input type="password" id="passwordBaru" name="passwordBaru" class="profil-input"
            placeholder="••••••••••••••" />
        </div>

        <div class="profil-form-group profil-form-group-full">
          <label for="konfirmasiPassword">Konfirmasi kata sandi baru</label>
          <input type="password" id="konfirmasiPassword" name="konfirmasiPassword" class="profil-input"
            placeholder="••••••••••••••" />
        </div>

      </form>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="profil-alert profil-alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="profil-alert profil-alert-error" th:text="${error}"></div>

  </main>
</th:block>
