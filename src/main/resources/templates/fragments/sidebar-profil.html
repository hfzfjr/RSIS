<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head></head>
  <body>
    <!-- Profile Sidebar Fragment -->
    <aside th:fragment="sidebar-profil (activeMenu)" class="profile-sidebar">
      <nav class="profile-nav">
        <a
          href="/pasien/profil-informasi"
          th:class="${activeMenu == 'informasi'} ? 'nav-item active' : 'nav-item'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Informasi Pribadi
        </a>
        <a
          href="/pasien/profil-medis"
          th:class="${activeMenu == 'medis'} ? 'nav-item active' : 'nav-item'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Profil Medis
        </a>
        <a
          href="/pasien/profil-notifikasi"
          th:class="${activeMenu == 'notifikasi'} ? 'nav-item active' : 'nav-item'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          Notifikasi
        </a>
        <a
          href="/pasien/profil-keamanan"
          th:class="${activeMenu == 'keamanan'} ? 'nav-item active' : 'nav-item'"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Keamanan Akun
        </a>
      </nav>
    </aside>
  </body>
</html>
