<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Tersedia - RSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RSIS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/jadwal/list">Daftar Jadwal</a>
                <a class="nav-link active" href="/jadwal/available">Jadwal Tersedia</a>
                <a class="nav-link" href="/jadwal/create">Tambah Jadwal</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3>Jadwal Tersedia</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${jadwals == null or jadwals.empty}" class="alert alert-info">
                            Tidak ada jadwal tersedia saat ini.
                        </div>
                        
                        <div th:if="${jadwals != null and !jadwals.empty}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Dokter</th>
                                        <th>Spesialisasi</th>
                                        <th>Poli</th>
                                        <th>Hari</th>
                                        <th>Jam Mulai</th>
                                        <th>Jam Selesai</th>
                                        <th>Sisa Kuota</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="jadwal : ${jadwals}">
                                        <td th:text="${jadwal.dokter != null ? jadwal.dokter.nama : 'N/A'}"></td>
                                        <td th:text="${jadwal.dokter != null && jadwal.dokter.spesialisasi != null ? jadwal.dokter.spesialisasi.namaSpesialisasi : 'N/A'}"></td>
                                        <td th:text="${jadwal.dokter != null && jadwal.dokter.poli != null ? jadwal.dokter.poli.namaPoli : 'N/A'}"></td>
                                        <td th:text="${jadwal.hari}"></td>
                                        <td th:text="${jadwal.jamMulai}"></td>
                                        <td th:text="${jadwal.jamSelesai}"></td>
                                        <td th:text="${jadwal.sisaKuota}"></td>
                                        <td>
                                            <a th:href="@{/appointment/booking(jadwalId=${jadwal.idJadwal})}" class="btn btn-sm btn-primary">Booking</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
