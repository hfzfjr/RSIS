<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Jadwal - RSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RSIS</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/jadwal/list">Daftar Jadwal</a>
                <a class="nav-link" href="/jadwal/available">Jadwal Tersedia</a>
                <a class="nav-link" href="/jadwal/create">Tambah Jadwal</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3>Daftar Jadwal Praktik</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <div th:if="${jadwals == null or jadwals.empty}" class="alert alert-info">
                            Belum ada jadwal praktik.
                        </div>
                        
                        <div th:if="${jadwals != null and !jadwals.empty}">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID Jadwal</th>
                                        <th>Dokter</th>
                                        <th>Hari</th>
                                        <th>Jam Mulai</th>
                                        <th>Jam Selesai</th>
                                        <th>Kuota</th>
                                        <th>Sisa Kuota</th>
                                        <th>Status</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="jadwal : ${jadwals}">
                                        <td th:text="${jadwal.idJadwal}"></td>
                                        <td th:text="${jadwal.dokter != null ? jadwal.dokter.nama : 'N/A'}"></td>
                                        <td th:text="${jadwal.hari}"></td>
                                        <td th:text="${jadwal.jamMulai}"></td>
                                        <td th:text="${jadwal.jamSelesai}"></td>
                                        <td th:text="${jadwal.kuota}"></td>
                                        <td th:text="${jadwal.sisaKuota}"></td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="'badge bg-' + (${jadwal.statusKetersediaan} == 'TERSEDIA' ? 'success' : 'danger')"
                                                  th:text="${jadwal.statusKetersediaan}"></span>
                                        </td>
                                        <td>
                                            <a th:href="@{/jadwal/edit/{id}(id=${jadwal.idJadwal})}" class="btn btn-sm btn-warning">Edit</a>
                                            <form th:action="@{/jadwal/delete/{id}(id=${jadwal.idJadwal})}" 
                                                  method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Hapus jadwal ini?')">Hapus</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
