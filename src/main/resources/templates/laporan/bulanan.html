<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Bulanan - RSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RSIS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                <a class="nav-link active" href="/laporan">Laporan</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3>Laporan Bulanan</h3>
                        <form th:action="@{/laporan/bulanan}" method="get" class="d-inline">
                            <div class="row g-3 align-items-center">
                                <div class="col-auto">
                                    <label for="bulan" class="col-form-label">Bulan:</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="bulan" name="bulan">
                                        <option th:value="1" th:selected="${bulan == 1}">Januari</option>
                                        <option th:value="2" th:selected="${bulan == 2}">Februari</option>
                                        <option th:value="3" th:selected="${bulan == 3}">Maret</option>
                                        <option th:value="4" th:selected="${bulan == 4}">April</option>
                                        <option th:value="5" th:selected="${bulan == 5}">Mei</option>
                                        <option th:value="6" th:selected="${bulan == 6}">Juni</option>
                                        <option th:value="7" th:selected="${bulan == 7}">Juli</option>
                                        <option th:value="8" th:selected="${bulan == 8}">Agustus</option>
                                        <option th:value="9" th:selected="${bulan == 9}">September</option>
                                        <option th:value="10" th:selected="${bulan == 10}">Oktober</option>
                                        <option th:value="11" th:selected="${bulan == 11}">November</option>
                                        <option th:value="12" th:selected="${bulan == 12}">Desember</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <label for="tahun" class="col-form-label">Tahun:</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="tahun" name="tahun" th:value="${tahun}" min="2020" max="2030">
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary">Filter</button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="card-body">
                        <div th:if="${statistik != null}">
                            <div class="row mt-4">
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Pasien Bulan Ini</h5>
                                            <p class="card-text display-4" th:text="${statistik.totalPasienBulanIni}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Pasien Hari Ini</h5>
                                            <p class="card-text display-4" th:text="${statistik.totalPasienHariIni}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Total Dokter</h5>
                                            <p class="card-text display-4" th:text="${statistik.totalDokter}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card text-center">
                                        <div class="card-body">
                                            <h5 class="card-title">Total Poli</h5>
                                            <p class="card-text display-4" th:text="${statistik.totalPoli}"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mt-4">
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5>Dokter Tersibuk</h5>
                                        </div>
                                        <div class="card-body">
                                            <p class="card-text" th:text="${statistik.dokterTersibuk}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5>Appointment Dibatalkan</h5>
                                        </div>
                                        <div class="card-body">
                                            <p class="card-text" th:text="${statistik.totalAppointmentBatal}"></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mt-4">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-header">
                                            <h5>Export Laporan</h5>
                                        </div>
                                        <div class="card-body">
                                            <a th:href="@{/laporan/export/csv(bulan=${bulan}, tahun=${tahun})}" class="btn btn-success">Export CSV</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
