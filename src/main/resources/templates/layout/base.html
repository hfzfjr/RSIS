<!doctype html>
<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout (title, navbar, content)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#1b6b4a">
    <meta name="apple-mobile-web-app-title" content="RSIS">
    <th:block th:replace="${head} ?: ~{}"></th:block>
  </head>
  <body>
    <!-- Navbar - Dipilih berdasarkan role -->
    <nav th:if="${navbar} != null" th:replace="${navbar}"></nav>

    <!-- Main Content -->
    <main th:replace="${content}"></main>

    <script src="/js/main.js"></script>
    <script src="/js/dashboard.js"></script>
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
  </body>
</html>
