<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
    <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  </head>
  <body>
    <!-- Navbar Fragment untuk Pasien -->
    <nav th:fragment="navbar" class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <img
            src="/images/logo-tulisan-rsis.png"
            alt="RSIS"
            class="nav-logo"
          />
        </div>
        <div class="nav-menu">
          <a
            href="/dokter/dashboard"
            class="nav-link active"
            th:class="${activeMenu == 'dashboard'} ? 'nav-link active' : 'nav-link'"
            >Dashboard</a
          >
          <a
            href="/dokter/cari-dokter"
            class="nav-link"
            th:class="${activeMenu == 'cari-dokter'} ? 'nav-link active' : 'nav-link'"
            >Jadwal Praktik</a
          >
          <a
            href="/dokter/jadwal-riwayat"
            class="nav-link"
            th:class="${activeMenu == 'jadwal'} ? 'nav-link active' : 'nav-link'"
            >Appointment</a
          >
        </div>
        <div class="nav-actions">
          <button class="nav-btn nav-btn-icon" id="notifikasiBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <a href="/dokter/profil" class="nav-profile-link">
            <div class="nav-profile">
              <div class="nav-user-info">
                <span
                  class="nav-username"
                  th:text="${nama != null ? nama : 'Pengguna'}"
                  >Pengguna</span
                >
                <span
                  class="nav-userrole"
                  th:text="${role != null ? role : 'Pasien'}"
                  >Pasien</span
                >
              </div>
              <div class="nav-avatar-initials" id="avatarInitials">A</div>
            </div>
          </a>
        </div>
      </div>
    </nav>
    <!-- Notifikasi Overlay -->
    <div th:replace="fragments/overlay/notifikasi :: notifikasi-overlay"></div>
    <script>
      // Wait for the page to fully load
      window.addEventListener('load', function() {
        console.log("Page fully loaded");
        
        // Use a small timeout to ensure Thymeleaf has rendered the fragment
        setTimeout(function() {
          console.log("Initializing notification overlay");
          const notifikasiBtn = document.getElementById("notifikasiBtn");
          const notifikasiOverlay = document.getElementById("notifikasiOverlay");
          const closeNotifikasi = document.getElementById("closeNotifikasi");

          console.log("notifikasiBtn:", notifikasiBtn);
          console.log("notifikasiOverlay:", notifikasiOverlay);
          console.log("closeNotifikasi:", closeNotifikasi);

          if (notifikasiBtn && notifikasiOverlay) {
            notifikasiBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              console.log("Notification button clicked");
              notifikasiOverlay.classList.toggle("active");
              console.log("Overlay classes:", notifikasiOverlay.className);
              console.log("Overlay display:", window.getComputedStyle(notifikasiOverlay).display);
            });

            if (closeNotifikasi) {
              closeNotifikasi.addEventListener("click", function (e) {
                e.stopPropagation();
                notifikasiOverlay.classList.remove("active");
              });
            }

            document.addEventListener("click", function (e) {
              if (
                !notifikasiOverlay.contains(e.target) &&
                e.target !== notifikasiBtn
              ) {
                notifikasiOverlay.classList.remove("active");
              }
            });
          } else {
            console.error("Notification elements not found");
            console.error("notifikasiBtn:", notifikasiBtn);
            console.error("notifikasiOverlay:", notifikasiOverlay);
          }

          // Generate first letter from username
          const usernameElement = document.querySelector(".nav-username");
          const avatarInitialsElement = document.getElementById("avatarInitials");
          if (usernameElement && avatarInitialsElement) {
            const username = usernameElement.textContent.trim();
            const firstLetter = username.charAt(0).toUpperCase();
            avatarInitialsElement.textContent = firstLetter;
          }
        }, 100);
      });
    </script>
  </body>
</html>
