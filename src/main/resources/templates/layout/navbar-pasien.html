<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- Navbar Fragment untuk Pasien -->
    <header th:fragment="navbar" class="header">
      <div class="container header-container">
        <div class="logo">
          <a href="/pasien/dashboard">
            <img src="/images/logo-rsis.png" alt="RSIS" height="32" />
          </a>
        </div>
        <nav class="nav">
          <a href="/pasien/dashboard" class="nav-link">Dashboard</a>
          <a href="/pasien/cari-dokter" class="nav-link">Cari Dokter</a>
          <a href="/pasien/jadwal-dokter" class="nav-link">Jadwal</a>
          <a href="/pasien/riwayat-appointment" class="nav-link">Riwayat</a>
        </nav>
        <div class="header-actions">
          <span
            class="user-name"
            th:text="${#authentication.principal.username}"
            >Pasien</span
          >
          <a href="/logout" class="btn btn-outline btn-small">Keluar</a>
        </div>
      </div>
    </header>
  </body>
</html>
