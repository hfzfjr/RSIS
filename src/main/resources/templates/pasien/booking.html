<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Janji Temu - RSIS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/notifikasi.css" />
  <link rel="stylesheet" href="/css/pasien/booking.css" />
  <link rel="stylesheet" href="/css/fragments/jadwal-dokter.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/pasien/konfirmasi-booking.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/pasien/lengkapi-profil.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>

<body>
  <!-- Navbar Fragment -->
  <div th:replace="~{layout/navbar :: navbar('booking')}"></div>

  <main class="main-container">
    <div class="booking-layout">

      <!-- Left Sidebar - Doctor Info -->
      <aside class="doctor-sidebar" th:if="${dokter != null}">
        <div class="doctor-profile-card">
          <div class="doctor-image-wrapper">
            <img
              th:src="${dokter.dokterImage != null && !dokter.dokterImage.isEmpty() ? dokter.dokterImage : '/images/dokter.png'}"
              alt="Dokter" class="doctor-avatar-image" />
          </div>
          <div class="doctor-info">
            <h1 class="doctor-name" th:text="${dokter != null ? 'dr. ' + dokter.nama : 'Dokter'}">
              dr. Nama Dokter
            </h1>
            <p class="doctor-specialty"
              th:text="${spesialisasi != null ? 'Spesialis ' + spesialisasi.nama : 'Spesialis'}">
              Spesialis
            </p>
          </div>
          <div class="doctor-about">
            <h3 class="about-title">Tentang Dokter</h3>
            <p class="about-text"
              th:text="${spesialisasi != null and spesialisasi.deskripsi != null ? spesialisasi.deskripsi : 'Dokter spesialis yang berdedikasi memberikan pelayanan medis terbaik.'}">
              Deskripsi dokter
            </p>
          </div>
        </div>
      </aside>

      <!-- Right Content -->
      <section class="booking-content">

        <!-- Date Selection -->
        <div class="booking-card">
          <h2 class="card-title">Pilih Tanggal Kunjungan</h2>
          <div th:if="${dokter != null}">
            <div th:replace="~{fragments/jadwal-dokter :: jadwal-dokter(${dokter.idUser}, 'pasien')}"></div>
          </div>
          <div th:if="${dokter == null}">
            <p style="color: #6b7280; padding: 20px; text-align: center;">Silakan pilih dokter terlebih dahulu</p>
          </div>
        </div>

        <!-- Detail Keluhan & Konfirmasi -->
        <div class="booking-footer">
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

          <form th:action="@{/appointment/booking}" th:object="${bookingRequest}" method="post">
            <input type="hidden" id="jadwalId" th:field="*{jadwalId}"
              th:value="${jadwal != null ? jadwal.idJadwal : ''}" />

            <!-- Detail Keluhan -->
            <div class="keluhan-card" style="margin-bottom: 16px;">
              <h3 class="keluhan-title">Detail Keluhan :</h3>
              <textarea class="form-control" id="catatan" th:field="*{catatan}" rows="5"
                placeholder="Tuliskan detail keluhan"></textarea>
            </div>

            <!-- Tombol Konfirmasi -->
            <div class="btn-confirm-wrapper">
              <button type="button" class="btn-konfirmasi" onclick="showKonfirmasiBooking()">
                Konfirmasi Jadwal
              </button>
            </div>

          </form>
        </div>

      </section>
    </div>
  </main>

  <!-- Konfirmasi Booking Overlay -->
  <div th:replace="~{fragments/overlay/pasien/konfirmasi-booking}"></div>

  <!-- Lengkapi Profil Overlay -->
  <div th:replace="~{fragments/overlay/pasien/lengkapi-profil :: lengkapi-profil-overlay}"></div>

  <script th:inline="javascript">
    /*<![CDATA[*/

    // Global variable to store selected jadwal data
    let selectedJadwalForBooking = null;
    let selectedDokterForBooking = /*[[${dokter}]]*/ null;
    let selectedSpesialisasiForBooking = /*[[${spesialisasi}]]*/ null;
    let selectedPoliForBooking = /*[[${poli}]]*/ null;

    // Profile data from server
    const profileData = {
      nomorHp: /*[[${nomorHp}]]*/ null,
      tanggalLahir: /*[[${tanggalLahir}]]*/ null,
      alamat: /*[[${alamat}]]*/ null
    };

    function showKonfirmasiBooking() {
      // Validate profile data first
      if (!profileData.nomorHp || !profileData.tanggalLahir || !profileData.alamat) {
        showLengkapiProfilOverlay();
        return;
      }

      const jadwalIdInput = document.getElementById('jadwalId');
      const catatanInput = document.getElementById('catatan');

      // Get selected jadwal ID from jadwal-dokter component
      const selectedJadwalId = document.getElementById('selectedJadwalId')?.value;

      if (!selectedJadwalId) {
        alert('Silakan pilih jadwal terlebih dahulu');
        return;
      }

      // Update the hidden jadwalId input
      if (jadwalIdInput) {
        jadwalIdInput.value = selectedJadwalId;
      }

      // Get jadwal data from window.jadwalData
      const jadwalData = window.jadwalData || [];

      // Debug: log jadwalData and selectedJadwalId
      console.log('Selected Jadwal ID:', selectedJadwalId);
      console.log('Jadwal Data:', jadwalData);

      // Find the selected jadwal from the data
      const selectedJadwal = jadwalData.find(j => j.idJadwal === selectedJadwalId);

      if (!selectedJadwal) {
        console.error('Jadwal not found. Available IDs:', jadwalData.map(j => j.idJadwal));
        alert('Jadwal tidak ditemukan. Silakan pilih jadwal kembali.');
        return;
      }

      // Call the overlay function
      if (typeof openKonfirmasiBooking === 'function') {
        openKonfirmasiBooking(
          selectedJadwal,
          selectedDokterForBooking,
          selectedSpesialisasiForBooking,
          selectedPoliForBooking,
          catatanInput ? catatanInput.value : ''
        );
      }
    }

    function showLengkapiProfilOverlay() {
      const overlay = document.getElementById('lengkapiProfilOverlay');
      if (overlay) {
        overlay.classList.add('active');
      }
    }

    function hideLengkapiProfilOverlay() {
      const overlay = document.getElementById('lengkapiProfilOverlay');
      if (overlay) {
        overlay.classList.remove('active');
      }
    }

    // Initialize lengkapi-profil overlay event listeners
    document.addEventListener('DOMContentLoaded', function () {
      const closeBtn = document.getElementById('closeLengkapiProfil');
      const cancelBtn = document.getElementById('cancelLengkapiProfil');
      const overlay = document.getElementById('lengkapiProfilOverlay');

      if (closeBtn) {
        closeBtn.addEventListener('click', hideLengkapiProfilOverlay);
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', hideLengkapiProfilOverlay);
      }

      if (overlay) {
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) {
            hideLengkapiProfilOverlay();
          }
        });
      }
    });

    /*]]>*/
  </script>
</body>

</html>
