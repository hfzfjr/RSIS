<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Janji Temu - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout/navbar.css" />
    <link rel="stylesheet" href="/css/pasien/booking.css" />
  </head>
  <body>
    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar-pasien :: navbar}"></div>

    <main class="main-container">
      <div class="booking-layout">

        <!-- Left Sidebar - Doctor Info -->
        <aside class="doctor-sidebar">
          <div class="doctor-profile-card">
            <div class="doctor-image-wrapper">
              <img
                th:src="@{/images/doctor-large.jpg}"
                src="/images/doctor-large.jpg"
                alt="Foto Dokter"
                class="doctor-image"
              />
            </div>
            <div class="doctor-info">
              <h1 class="doctor-name" th:text="${dokter != null ? 'dr. ' + dokter.nama : 'Dokter'}">
                dr. Nama Dokter
              </h1>
              <p class="doctor-specialty"
                th:text="${spesialisasi != null ? spesialisasi.nama : 'Spesialis'}">
                Spesialis
              </p>
            </div>
            <div class="doctor-about">
              <h3 class="about-title">Tentang Dokter</h3>
              <p class="about-text"
                th:text="${spesialisasi != null and spesialisasi.deskripsi != null ? spesialisasi.deskripsi : 'Dokter spesialis yang berdedikasi memberikan pelayanan medis terbaik.'}">
                Deskripsi dokter
              </p>
            </div>
          </div>
        </aside>

        <!-- Right Content -->
        <section class="booking-content">

          <!-- Date Selection -->
          <div class="booking-card" th:if="${availableDates != null and availableDates.size() > 0}">
            <h2 class="card-title">Pilih Tanggal Kunjungan</h2>
            <div class="date-carousel">
              <th:block th:each="jadwalItem, stat : ${availableDates}">
                <a th:href="@{/appointment/booking(jadwalId=${jadwalItem.idJadwal})}"
                   class="date-item"
                   th:classappend="${jadwal != null and jadwal.idJadwal == jadwalItem.idJadwal ? 'active' : ''} + ${jadwalItem.sisaKuota == 0 ? ' disabled' : ''}"
                   th:disabled="${jadwalItem.sisaKuota == 0}">
                  <span class="date-month" th:text="${jadwalItem.tanggal != null ? #temporals.format(jadwalItem.tanggal, 'MMM') : ''}">Okt</span>
                  <span class="date-day" th:text="${jadwalItem.tanggal != null ? #temporals.format(jadwalItem.tanggal, 'd') : ''}">14</span>
                  <span class="date-weekday" th:text="${jadwalItem.sisaKuota == 0 ? 'Penuh' : jadwalItem.hari}">Senin</span>
                </a>
              </th:block>
            </div>
          </div>

          <!-- Time Slots -->
          <div class="time-slots-card" th:if="${jadwal != null}">
            <div class="session-section">
              <div class="session-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"/>
                  <line x1="12" y1="1"  x2="12" y2="3"/>
                  <line x1="12" y1="21" x2="12" y2="23"/>
                  <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                  <line x1="1" y1="12"  x2="3" y2="12"/>
                  <line x1="21" y1="12" x2="23" y2="12"/>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                  <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
                </svg>
                <span>JADWAL PRAKTEK</span>
              </div>
              <div class="time-slots">
                <button class="time-slot active" type="button"
                  th:text="${jadwal.jamMulai != null ? #temporals.format(jadwal.jamMulai, 'HH:mm') : '-'}">
                  09:00
                </button>
                <span class="time-info"
                  th:text="'s.d. ' + (${jadwal.jamSelesai != null ? #temporals.format(jadwal.jamSelesai, 'HH:mm') : '-'})">
                  s.d. 10:00
                </span>
              </div>
            </div>
          </div>

          <!-- Time Slots - Available Dates Selection -->
          <div class="time-slots-card" th:if="${availableDates != null and availableDates.size() > 0}">
            <div class="session-section">
              <div class="session-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"/>
                  <line x1="12" y1="1"  x2="12" y2="3"/>
                  <line x1="12" y1="21" x2="12" y2="23"/>
                  <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                  <line x1="1" y1="12"  x2="3" y2="12"/>
                  <line x1="21" y1="12" x2="23" y2="12"/>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                  <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
                </svg>
                <span>PILIH JADWAL</span>
              </div>
              <div class="time-slots">
                <th:block th:each="jadwalItem : ${availableDates}">
                  <a th:href="@{/appointment/booking(jadwalId=${jadwalItem.idJadwal})}"
                     class="time-slot"
                     th:classappend="${jadwal != null and jadwal.idJadwal == jadwalItem.idJadwal ? 'active' : ''} + ${jadwalItem.sisaKuota == 0 ? ' disabled' : ''}"
                     th:disabled="${jadwalItem.sisaKuota == 0}">
                    <span th:text="${jadwalItem.hari}">Senin</span>
                    <span th:text="${jadwalItem.tanggal != null ? #temporals.format(jadwalItem.tanggal, 'dd MMM') : ''}">14 Okt</span>
                    <span th:text="${jadwalItem.jamMulai != null ? #temporals.format(jadwalItem.jamMulai, 'HH:mm') : ''}">09:00</span>
                  </a>
                </th:block>
              </div>
            </div>
          </div>

          <!-- Detail Keluhan & Konfirmasi -->
          <div class="booking-footer">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form
              th:action="@{/appointment/booking}"
              th:object="${bookingRequest}"
              method="post"
            >
              <input type="hidden" id="jadwalId"
                th:field="*{jadwalId}"
                th:value="${jadwal != null ? jadwal.idJadwal : ''}" />

              <!-- Detail Keluhan -->
              <div class="keluhan-card" style="margin-bottom: 16px;">
                <h3 class="keluhan-title">Detail Keluhan :</h3>
                <textarea
                  class="form-control"
                  id="catatan"
                  th:field="*{catatan}"
                  rows="5"
                  placeholder="Tuliskan detail keluhan"
                ></textarea>
              </div>

              <!-- Tombol Konfirmasi -->
              <div class="btn-confirm-wrapper">
                <button type="submit" class="btn-confirm">
                  Konfirmasi Jadwal
                </button>
              </div>

            </form>
          </div>

        </section>
      </div>
    </main>
  </body>
</html>
