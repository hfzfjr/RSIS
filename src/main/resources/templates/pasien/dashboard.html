<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Pasien - RSIS</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div class="brand">
            <img class="brand-logo" src="/images/logo-rsis.png" alt="RSIS" />
            <div>
                <div class="brand-name">RSIS</div>
                <div class="brand-sub">Dashboard Pasien</div>
            </div>
        </div>

        <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn btn-ghost" type="submit">Logout</button>
        </form>
    </header>

    <section class="content">
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">
            Login berhasil
        </div>

        <div class="card">
            <h1 class="h1">Selamat datang</h1>
            <p class="muted" th:if="${email}">
                Kamu login sebagai <strong th:text="${email}">email@contoh.com</strong>.
            </p>

            <div class="grid">
                <a class="tile" href="/pasien/cari-dokter">
                    <div class="tile-title">Cari Dokter</div>
                    <div class="tile-sub">Lihat daftar dokter & spesialisasi</div>
                </a>
                <a class="tile" href="/pasien/jadwal-dokter">
                    <div class="tile-title">Jadwal Dokter</div>
                    <div class="tile-sub">Cek jadwal praktik dokter</div>
                </a>
                <a class="tile" href="/pasien/booking">
                    <div class="tile-title">Booking</div>
                    <div class="tile-sub">Buat janji temu (appointment)</div>
                </a>
                <a class="tile" href="/pasien/riwayat-appointment">
                    <div class="tile-title">Riwayat</div>
                    <div class="tile-sub">Lihat riwayat appointment kamu</div>
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
