<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal & Riwayat - RSIS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/fragments/layout/navbar.css" />
  <link rel="stylesheet" href="/css/pasien/jadwal-riwayat.css" />
  <link rel="stylesheet" href="/css/fragments/overlay/pasien/detail-riwayat-booking.css" />
  <link rel="icon" type="image/png" href="/images/logo-rsis.png" />
</head>

<body>
  <!-- Navbar Fragment -->
  <div th:replace="~{layout/navbar :: navbar('jadwal')}"></div>

  <main class="main-container">
    <!-- Header Section -->
    <section class="page-header">
      <div class="header-content">
        <div>
          <h1 class="page-title">Jadwal & Riwayat Booking</h1>
          <p class="page-subtitle">
            Lihat dan kelola semua riwayat konsultasi medis Anda
          </p>
        </div>
        <div class="header-actions">
        </div>
      </div>
    </section>

    <!-- Filters Section -->
    <section class="filters-section">
      <div class="filters-row">
        <div class="search-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Cari nama dokter atau spesialisasi..." />
        </div>
        <select id="statusFilter" class="status-filter">
          <option value="">Semua Status</option>
          <option value="MENUNGGU">Menunggu</option>
          <option value="DIKONFIRMASI">Dikonfirmasi</option>
          <option value="SELESAI">Selesai</option>
          <option value="DITOLAK">Ditolak</option>
          <option value="DIBATALKAN">Dibatalkan</option>
        </select>
      </div>
    </section>

    <!-- Table Section -->
    <section class="table-section">
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div th:if="${appointments == null or appointments.empty}" class="alert alert-info">
        Belum ada appointment.
      </div>

      <div th:if="${appointments != null and !appointments.empty}" class="table-container">
        <table class="appointment-table">
          <thead>
            <tr>
              <th class="col-doctor">DOKTER</th>
              <th class="col-date">TANGGAL & WAKTU</th>
              <th class="col-type">KELUHAN</th>
              <th class="col-status">STATUS</th>
              <th class="col-action">AKSI</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="appointment : ${appointments}">
              <td class="col-doctor">
                <div class="doctor-info">
                  <div class="doctor-avatar">
                    <img
                      th:src="${appointment.jadwal.dokter.dokterImage != null ? appointment.jadwal.dokter.dokterImage : '/images/dokter.png'}"
                      alt="Dokter" class="doctor-avatar-image" />
                  </div>
                  <div class="doctor-details">
                    <span class="doctor-name"
                      th:text="${appointment.jadwal.dokter != null ? appointment.jadwal.dokter.nama : 'N/A'}"></span>
                    <span class="doctor-specialty"
                      th:text="${appointment.jadwal.dokter != null && appointment.jadwal.dokter.spesialisasi != null ? 'Spesialis ' + appointment.jadwal.dokter.spesialisasi.nama : 'Spesialis'}"></span>
                  </div>
                </div>
              </td>
              <td class="col-date">
                <div class="date-time">
                  <span class="date" th:text="${appointment.tanggalBooking}"></span>
                  <span class="time"
                    th:text="${appointment.jadwal != null ? appointment.jadwal.jamMulai : 'N/A'}"></span>
                </div>
              </td>
              <td class="col-type"
                th:text="${appointment.catatan != null && !appointment.catatan.isEmpty() ? appointment.catatan : '-'}">
              </td>
              <td class="col-status">
                <span class="status-badge"
                  th:class="${'status-badge ' + (appointment.status == 'MENUNGGU' ? 'status-menunggu' : appointment.status == 'DIKONFIRMASI' ? 'status-dikonfirmasi' : appointment.status == 'SELESAI' ? 'status-selesai' : appointment.status == 'DITOLAK' ? 'status-ditolak' : appointment.status == 'DIBATALKAN' ? 'status-dibatalkan' : 'status-menunggu')}">
                  <span class="status-dot"></span>
                  <span th:text="${appointment.status}"></span>
                </span>
              </td>
              <td class="col-action">
                <div class="action-buttons">
                  <button th:data-id="${appointment.idAppointment}" onclick="openOverlay(this.dataset.id)"
                    class="btn-text">Selengkapnya</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Detail Booking Overlay -->
  <div th:replace="~{fragments/overlay/pasien/detail-riwayat-booking.html}"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const searchInput = document.getElementById('searchInput');
      const statusFilter = document.getElementById('statusFilter');
      const tableRows = document.querySelectorAll('.appointment-table tbody tr');

      function filterTable() {
        const searchValue = searchInput.value.toLowerCase();
        const statusValue = statusFilter.value;

        tableRows.forEach(row => {
          const doctorName = row.querySelector('.doctor-name')?.textContent.toLowerCase() || '';
          const doctorSpecialty = row.querySelector('.doctor-specialty')?.textContent.toLowerCase() || '';
          const statusCell = row.querySelector('.col-status');
          const statusText = statusCell?.textContent.trim() || '';

          const matchesSearch = doctorName.includes(searchValue) || doctorSpecialty.includes(searchValue);
          const matchesStatus = statusValue === '' || statusText === statusValue;

          row.style.display = matchesSearch && matchesStatus ? '' : 'none';
        });
      }

      searchInput.addEventListener('input', filterTable);
      statusFilter.addEventListener('change', filterTable);
    });
  </script>
</body>

</html>
