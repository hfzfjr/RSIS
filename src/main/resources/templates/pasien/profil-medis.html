<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Medis - RSIS</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/navbar-pasien.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/profil.css" />
  </head>
  <body>
    <!-- Navbar Fragment -->
    <div th:replace="~{layout/navbar-pasien :: navbar}"></div>

    <main class="main-container">
      <div class="profile-layout">
        <!-- Left Sidebar Fragment -->
        <div
          th:replace="~{fragments/sidebar-profil :: sidebar-profil (activeMenu='medis')}"
        ></div>

        <!-- Main Content -->
        <section class="profile-content">
          <!-- Medical Identity Card -->
          <div class="profile-form-card">
            <div class="form-header">
              <div>
                <h2 class="form-title">Identitas Medis</h2>
                <p class="form-subtitle">
                  Data klinis penting untuk penanganan darurat dan konsultasi.
                </p>
              </div>
            </div>

            <!-- Medical Stats -->
            <div class="medical-stats">
              <div class="medical-stat-card">
                <div class="stat-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                  </svg>
                </div>
                <div class="stat-label">Golongan Darah</div>
                <div class="stat-value-large">B+</div>
              </div>
              <div class="medical-stat-card">
                <div class="stat-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M3 6l3 1"></path>
                    <path d="M6 19l3 1"></path>
                    <path d="M4.5 10l13.5 3.5"></path>
                    <path d="M19.5 13l-13.5-3.5"></path>
                    <circle cx="6" cy="5" r="1"></circle>
                    <circle cx="18" cy="16" r="1"></circle>
                  </svg>
                </div>
                <div class="stat-label">Berat Badan</div>
                <div class="stat-value-large">
                  74<span class="stat-unit">kg</span>
                </div>
              </div>
              <div class="medical-stat-card">
                <div class="stat-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M12 2v20"></path>
                    <path d="M2 12h20"></path>
                    <circle cx="12" cy="12" r="10"></circle>
                  </svg>
                </div>
                <div class="stat-label">Tinggi Badan</div>
                <div class="stat-value-large">
                  178<span class="stat-unit">cm</span>
                </div>
              </div>
            </div>

            <!-- Medical Details -->
            <div class="medical-details">
              <div class="medical-section">
                <label class="section-label">Alergi Makanan/Obat</label>
                <div class="tag-list">
                  <span class="medical-tag alergi">Kacang</span>
                  <span class="medical-tag alergi">Penisilin</span>
                  <button class="btn-add-tag">
                    <svg
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Tambah
                  </button>
                </div>
              </div>
              <div class="medical-section">
                <label class="section-label">Riwayat Kronis</label>
                <div class="tag-list">
                  <span class="medical-tag kronis">Hipertensi</span>
                  <button class="btn-add-tag">
                    <svg
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Tambah
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
