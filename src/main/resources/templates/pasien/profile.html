<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pasien - RSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">RSIS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/pasien/dashboard">Dashboard</a>
                <a class="nav-link active" href="/pasien/profile">Profil</a>
                <a class="nav-link" href="/appointment/my-appointments">Appointment Saya</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h3>Profil Pasien</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/pasien/profile}" th:object="${pasien}" method="post" th:if="${pasien != null}">
                            <div class="mb-3">
                                <label for="nomorRekamMedis" class="form-label">Nomor Rekam Medis</label>
                                <input type="text" class="form-control" id="nomorRekamMedis" 
                                       th:value="${pasien.nomorRekamMedis}" name="nomorRekamMedis" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" 
                                       th:value="${pasien.nama}" name="nama" readonly>
                            </div>
                            
                            <div class="mb-3">
                                <label for="tanggalLahir" class="form-label">Tanggal Lahir</label>
                                <input type="date" class="form-control" id="tanggalLahir" 
                                       th:value="${pasien.tanggalLahir}" name="tanggalLahir" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="alamat" class="form-label">Alamat</label>
                                <textarea class="form-control" id="alamat" name="alamat" rows="3" 
                                          th:text="${pasien.alamat}" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="nomorHp" class="form-label">Nomor HP</label>
                                <input type="tel" class="form-control" id="nomorHp" 
                                       th:value="${pasien.nomorHp}" name="nomorHp" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" 
                                       th:value="${pasien.email}" name="email" readonly>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Update Profil</button>
                            <a href="/pasien/dashboard" class="btn btn-secondary">Kembali</a>
                        </form>
                        
                        <div th:if="${pasien == null}" class="alert alert-warning">
                            Data profil tidak tersedia.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
